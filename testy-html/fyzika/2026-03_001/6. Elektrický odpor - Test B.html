<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektrický odpor - Test B</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        h1 {

            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }

            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);

        .question-card {

        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;

        }

        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);

        .results-card {

        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;

            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;

        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);

        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Elektrický odpor</h1>
        <div class="subtitle">Test B</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>

                <div class="progress-bar-fill" id="progressBar"></div>

            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>

<script>
const questionsData = [
    {
        question: "Ako presne závisí elektrický odpor kovového vodiča od jeho dĺžky?",
        options: [
            { text: "Je priamo úmerný jeho dĺžke. Znamená to, že dlhší vodič má úmerne väčší odpor.", isCorrect: true, feedback: "" },
            { text: "Je nepriamo úmerný jeho dĺžke. Znamená to, že dlhší vodič má paradoxne menší odpor.", isCorrect: false, feedback: "Dlhšia trasa znamená pre voľné elektróny väčšie množstvo zrážok s iónmi mriežky. Preto je odpor priamo, a nie nepriamo úmerný dĺžke." },
            { text: "Závisí od dĺžky výhradne v prípade, že je vodič zvinutý do uzavretej cievky.", isCorrect: false, feedback: "Elektrický odpor závisí od celkovej dĺžky lúča materiálu vždy, bez ohľadu na to, či je vodič geometricky vyrovnaný alebo zvinutý." },
            { text: "Nezávisí od dĺžky, ale výhradne od hmotnostného elektrického odporu samotného materiálu.", isCorrect: false, feedback: "Materiál určuje merný odpor (ρ), avšak celkový fyzický odpor konkrétnej súčiastky (R) priamo závisí aj od jej dĺžky." }
        ]
    },
    {
        question: "Akú fyzikálnu jednotku má teplotný súčiniteľ elektrického odporu (označovaný symbolom $\\alpha$)?",
        options: [
            { text: "$K^{-1}$ (recipročný kelvin)", isCorrect: true, feedback: "" },
            { text: "$\\Omega \\cdot m$ (ohm meter)", isCorrect: false, feedback: "Ohm meter je jednotkou merného (hmotnostného) elektrického odporu ρ, nesúvisí so samotným teplotným súčiniteľom α." },
            { text: "$J \\cdot K^{-1}$ (joule na kelvin)", isCorrect: false, feedback: "Táto jednotka prislúcha veličinám spojeným s tepelnou kapacitou, zatiaľ čo α udáva len pomernú zmenu hodnoty v závislosti od teploty." },
            { text: "$\\Omega \\cdot K$ (ohm kelvin)", isCorrect: false, feedback: "Základná rovnica závislosti obsahuje výraz (1 + α*Δt). Aby bol súčin α*Δt bezrozmerný, jednotka α musí rušiť jednotku teploty, čiže je to 1/K." }
        ]
    },
    {
        question: "Čo sa stane s elektrickým odporom väčšiny kovových vodičov pri ich postupnom ochladzovaní na bežné, neextrémne teploty?",
        options: [
            { text: "Odpor sa bude plynule zmenšovať v dôsledku slabnúcich rozkmitov iónov mriežky.", isCorrect: true, feedback: "" },
            { text: "Odpor bude rásť, pretože vplyvom chladu sa spomaľuje rýchlosť presunu voľných elektrónov.", isCorrect: false, feedback: "Pri ochladení sa upokojuje kmitanie iónov kryštálovej mriežky. Tým sa znižuje počet prekážok pre elektróny, takže odpor klesá." },
            { text: "Odpor zostane úplne konštantný až do momentu, kým neklesne presne na kritickú teplotu.", isCorrect: false, feedback: "Odpor kovov nezostáva konštantný, ale mení sa lineárne s teplotou aj pri bežných podmienkach." },
            { text: "Odpor skokovo stúpne, pretože mriežka kovu pri ochladení fyzicky stuhne a stvrdne.", isCorrect: false, feedback: "Stuhnutie mriežky (zmenšenie rozkmitov) uľahčuje prechod elektrónov, čo logicky znamená pokles odporu, nie jeho nárast." }
        ]
    },
    {
        question: "Pre ktoré z nasledujúcich kovov sa pri experimentoch s extrémnym ochladzovaním zatiaľ NEZISTIL jav supravodivosti?",
        options: [
            { text: "Pre meď, železo a striebro.", isCorrect: true, feedback: "" },
            { text: "Pre hliník, volfrám a olovo.", isCorrect: false, feedback: "Olovo je v texte priamo spomenuté ako typický materiál, u ktorého supravodivosť nastáva pri poklese teploty pod 7,2 K." },
            { text: "Iba pre prísne vybrané zliatiny kovov, ako je napríklad konštantán.", isCorrect: false, feedback: "V študijnom texte sa uvádza, že supravodivosť sa dodnes nezistila napríklad u veľmi dobrých bežných vodičov, akými sú meď, železo a striebro." },
            { text: "Supravodivosť sa spoľahlivo podarilo dokázať pri absolútne všetkých známych kovoch.", isCorrect: false, feedback: "Toto tvrdenie je chybné. Existujú bežné kovy (napríklad meď alebo striebro), u ktorých sa tento jav v laboratóriách zatiaľ neprejavil." }
        ]
    },
    {
        question: "Čo sa deje s prúdom odoberaným zo zdroja, ak v elektrickom obvode k jednému rezistoru postupne pripájame ďalšie rezistory paralelne (vedľa seba)?",
        options: [
            { text: "Elektrický prúd v nerozvetvenej časti obvodu sa zväčšuje, pretože výsledný celkový odpor takýmto zapojením klesá.", isCorrect: true, feedback: "" },
            { text: "Elektrický prúd sa zmenšuje, pretože v dôsledku rozvetvenia stráca svoju silu vo viacerých vetvách.", isCorrect: false, feedback: "Prúd sa v jednotlivých vetvách síce delí, ale zdroj musí dodávať väčší celkový prúd, pretože každá nová vetva vytvára ďalšiu voľnú cestu pre elektróny (celkový odpor obvodu klesá)." },
            { text: "Celkový prúd zostáva konštantný, zvyšuje sa jedine úbytok elektrického napätia na rezistoroch.", isCorrect: false, feedback: "V paralelnom zapojení je napätie na rezistoroch zhodné s napätím zdroja, mení sa prúd práve v dôsledku klesajúceho celkového odporu." },
            { text: "Prúd v obvode silno kolíše, až kým sa všetky paralelné odpory navzájom tepelne nevyrovnajú.", isCorrect: false, feedback: "Pridávanie paralelných vetiev okamžite poskytuje nové cesty prúdu, čím celkový odpor ihneď klesne a celkový prúd sa stabilne zvýši." }
        ]
    },
    {
        question: "Ktorý parameter v rovnici pre elektrický odpor kovového vodiča ($R = \\rho \\cdot \\frac{l}{S}$) reprezentuje samotný vplyv materiálu, z ktorého je vodič vyrobený?",
        options: [
            { text: "Merný (alebo hmotnostný) elektrický odpor látky ($\\rho$).", isCorrect: true, feedback: "" },
            { text: "Dĺžka prítomného kovového vodiča ($l$).", isCorrect: false, feedback: "Dĺžka reprezentuje iba fyzický, geometrický rozmer jedného konkrétneho kusu vodiča, nie vnútornú charakteristiku jeho materiálu." },
            { text: "Teplotný súčiniteľ elektrického odporu ($\\alpha$).", isCorrect: false, feedback: "Teplotný súčiniteľ vyjadruje mieru reakcie materiálu na zmenu teploty. V základnom vzorci pre odpor geometrického telesa (l, S) sa nezobrazuje, tam figuruje parameter ρ." },
            { text: "Obsah priečneho rezu daného vodiča ($S$).", isCorrect: false, feedback: "Obsah rezu (čiže hrúbka vodiča) je čisto konštrukčný a priestorový parameter. O elektrických vlastnostiach samotnej látky vypovedá veličina ρ." }
        ]
    },
    {
        question: "Pri akej špecifickej podmienke dochádza k javu nazývanému supravodivosť (napríklad pri olove)?",
        options: [
            { text: "Ak je materiál hlboko ochladený pod špecifickú, tzv. kritickú teplotu (napríklad pod 7,2 K u olova).", isCorrect: true, feedback: "" },
            { text: "Ak je materiál dlhodobo vystavený extrémne silnému magnetickému poľu pri izbovej teplote.", isCorrect: false, feedback: "Supravodivosť síce dokáže spôsobiť levitáciu telies v magnetickom poli, jej spúšťačom a nutnou podmienkou je však extrémne ochladenie, nie pôsobenie magnetu." },
            { text: "Ak samotným vodičom prechádza prúd s oveľa vyššou intenzitou, než je jeho nominálna výrobná hodnota.", isCorrect: false, feedback: "Príliš veľký prúd materiál zahrieva, čo prirodzene vedie skôr k zvýšeniu odporu. Supravodivosť si vyžaduje extrémne nízke teploty okolia." },
            { text: "Ak je okolitá teplota vodiča ohriata presne na hodnotu tesne pod jeho bodom topenia.", isCorrect: false, feedback: "Zahrievanie látky odpor vždy len zvyšuje v dôsledku rastúcich rozkmitov mriežkových iónov. Supravodivosť je naopak výhradným fenoménom mrazivých teplôt." }
        ]
    },
    {
        question: "V praktickom školskom cvičení študent posúva pohyblivým kontaktom po obyčajnej tuhe z plniacej ceruzky, ktorá je v obvode spojená so žiarovkou. Čo sa v obvode v skutočnosti mení?",
        options: [
            { text: "Mení sa aktívna dĺžka tuhy prítomnej v obvode, čo plynule zväčšuje/zmenšuje jej odpor, a tým aj výsledný prúd a svietivosť.", isCorrect: true, feedback: "" },
            { text: "Posúvaním kontaktu sa deformuje plocha prierezu tuhy, čím sa elektrický odpor mení skokovo a žiarovka prudko bliká.", isCorrect: false, feedback: "Kontakt kĺzajúci sa po povrchu nemení hrúbku prierezu tuhy (S), ale jej zapojenú dĺžku (l)." },
            { text: "Trenie pri posúvaní zvyšuje teplotu tuhy, čo vedie k teoretickej okamžitej strate jej elektrického odporu.", isCorrect: false, feedback: "Teplo uvoľnené z trenia kontaktu je minimálne a zanedbateľné. Zmena správania žiarovky vyplýva primárne zo zmeny geometrickej dĺžky prekonávanej prúdom." },
            { text: "Zmena polohy nemá na svietivosť absolútne žiadny vplyv, keďže grafit z tuhy patrí medzi nevodiče (izolanty).", isCorrect: false, feedback: "Grafit je vodivou modifikáciou uhlíka a elektrický prúd vedie. Slúži tu teda v praxi ako plne funkčný premenlivý rezistor." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        setTimeout(function() { advanceToNext(); }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) {
        btn.classList.add('visible');
        btn.focus();
    }
}

function advanceToNext() {
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
