<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívny Test</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center; color: #fff; margin-bottom: 8px;
            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }
        .progress-wrapper {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px; transition: width 0.4s ease; width: 0%;
        }
        .question-card {
            background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .question-card.active { display: block; }
        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.95em; line-height: 1.4; color: #333;
        }
        .option-item:hover { border-color: #667eea; background: #f0f0ff; }
        .option-item.correct {
            border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 600;
        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 28px; font-size: 1em; border-radius: 25px;
            cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
            float: right; pointer-events: auto;
        }
        .next-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .next-btn.visible { display: inline-block; }
        .results-card {
            background: #fff; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .results-card h2 { font-size: 1.6em; margin-bottom: 10px; color: #333; }
        .results-score { font-size: 2.8em; font-weight: 700; margin: 20px 0; }
        .results-score.excellent { color: #4caf50; }
        .results-score.good { color: #ff9800; }
        .results-score.poor { color: #f44336; }
        .results-message { font-size: 1.05em; margin-bottom: 30px; color: #555; }
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 14px 40px; font-size: 1.05em; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { color: #f44336; margin-bottom: 12px; font-size: 1.2em; }
        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Zahrievanie vodiča elektrickým prúdom</h1>
        <div class="subtitle">Test A</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="quizContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Výsledky testu</h2>
            <div class="results-score" id="resultsScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="restart-btn" id="restartBtn">Skúsiť znova</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>Nesprávna odpoveď</h3>
            <p id="modalText"></p>
            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>
        </div>
    </div>

<script>
const questionsData = [
    {
        question: "Prečo dochádza k zahrievaniu vodiča pri prechode elektrického prúdu?",
        options: [
            { text: "Vodivostné elektróny pri svojom pohybe narážajú do častíc vodiča, čím sa časť ich pohybovej energie mení na vnútornú energiu.", isCorrect: true, feedback: "" },
            { text: "Zvýšené elektrické napätie spomaľuje pohyb iónov v mriežke, čo priamo vedie k prudkému uvoľňovaniu tepelnej energie do okolia.", isCorrect: false, feedback: "Napätie ióny nespomaľuje; teplo reálne vzniká zrážkami pohybujúcich sa vodivostných elektrónov s časticami vodiča." },
            { text: "Elektrické pole priamo znižuje vnútornú energiu vodiča, čo núti atómy vibrovať rýchlejšie a generovať dodatočné teplo.", isCorrect: false, feedback: "Elektrické pole vnútornú energiu neznižuje. Naopak, nárast vnútornej energie (z kinetickej) sa prejavuje zvýšením teploty." },
            { text: "Kladné náboje protónov pri prietoku prúdu narážajú na izolant, čím sa premieňa ich potenciálna energia na tepelnú.", isCorrect: false, feedback: "Elektrický prúd v pevných vodičoch nie je tvorený pohybom protónov, ale pohybom vodivostných elektrónov." }
        ]
    },
    {
        question: "Ako možno matematicky vyjadriť prácu síl elektrického poľa ($W$) pri konštantnom elektrickom prúde za určitý čas?",
        options: [
            { text: "$W = UIt$", isCorrect: true, feedback: "" },
            { text: "$W = \\frac{UI}{t}$", isCorrect: false, feedback: "Elektrická práca pri konštantnom prúde rastie lineárne s časom, preto sa s časom násobí, nie delí." },
            { text: "$W = \\frac{U}{It}$", isCorrect: false, feedback: "Tento vzorec je nesprávny, správny vzťah pre prácu je súčinom napätia, prúdu a času." },
            { text: "$W = I^2U$", isCorrect: false, feedback: "Tento vzorec je chybnou kombináciou veličín. Keby sme použili odpor miesto napätia, správny tvar by bol $RI^2t$." }
        ]
    },
    {
        question: "Čo presne fyzikálne vyjadruje veličina „výkon elektrického prúdu“ v spotrebiči?",
        options: [
            { text: "Vyjadruje Joulovo teplo, ktoré vznikne v spotrebiči presne za jednu sekundu.", isCorrect: true, feedback: "" },
            { text: "Vyjadruje celkový elektrický náboj, ktorý prejde spotrebičom za celú dobu jeho prevádzky.", isCorrect: false, feedback: "Celkový náboj prenesený za určitý čas súvisí s prúdom. Výkon vyjadruje prácu (resp. teplo) za jednotku času." },
            { text: "Definuje teoretickú účinnosť premeny elektrickej energie na mechanickú prácu v uzavretom obvode.", isCorrect: false, feedback: "Výkon nie je to isté čo účinnosť. Účinnosť je pomer, zatiaľ čo výkon je uvoľnené teplo za sekundu." },
            { text: "Predstavuje rozdiel medzi vnútorným odporom zdroja a napätím na svorkách spotrebiča.", isCorrect: false, feedback: "Výkon nepredstavuje rozdiel veličín. Vypočíta sa ako súčin napätia a prúdu ($P = UI$)." }
        ]
    },
    {
        question: "Od čoho závisí účinnosť premeny elektrickej energie v obvode (z hľadiska zastúpených odporov)?",
        options: [
            { text: "Účinnosť je tým väčšia, čím je väčší odpor spotrebiča v porovnaní s vnútorným odporom zdroja.", isCorrect: true, feedback: "" },
            { text: "Účinnosť je nezávislá od odporu spotrebiča, je fixne daná výlučne elektromotorickým napätím zdroja.", isCorrect: false, feedback: "Odpor spotrebiča ($R$) voči vnútornému odporu zdroja ($R_i$) priamo ovplyvňuje straty, a tým aj účinnosť." },
            { text: "Účinnosť obvodu logicky klesá, čím viac sa zvyšuje odpor pripojeného vonkajšieho spotrebiča.", isCorrect: false, feedback: "Je to presne naopak. Čím je odpor vonkajšieho spotrebiča vyšší v porovnaní so zdrojom, tým menšia časť energie sa stratí priamo v zdroji." },
            { text: "Účinnosť je maximálna práve vtedy, keď vnútorný odpor zdroja vysoko prevyšuje odpor pripojeného spotrebiča.", isCorrect: false, feedback: "V takomto prípade by sa väčšina dodanej energie premenila na teplo priamo vo vnútri zdroja, čo by účinnosť drasticky znížilo." }
        ]
    },
    {
        question: "Aká je hlavná funkcia a mechanizmus fungovania bežnej tavnej poistky?",
        options: [
            { text: "Pri zvýšenom elektrickom prúde sa drôtik poistky pretaví, čím sa obvod preruší a zabráni sa poškodeniu spotrebiča.", isCorrect: true, feedback: "" },
            { text: "Pri zvýšenom napätí poistka automaticky zníži odpor spotrebiča, aby prebytočná energia mohla plynule odtiecť mimo obvod.", isCorrect: false, feedback: "Tavná poistka nedokáže plynulo znižovať odpor. Reaguje na nadmerný prúd tým, že sa doslova roztaví a obvod úplne preruší." },
            { text: "Drôtik poistky sa pri nadmernom prúde silne ochladí, čím exponenciálne zvýši svoj odpor a obmedzí prietok bez prerušenia.", isCorrect: false, feedback: "Prechádzajúci prúd vodič vždy zahrieva (Joulovo teplo), neochladzuje ho. Poistka funguje práve vďaka roztaveniu teplom." },
            { text: "Pri skrate poistka vďaka svojej štruktúre absorbuje prebytočný prúd a natrvalo ho uloží do svojej konštrukcie.", isCorrect: false, feedback: "Poistka nefunguje ako zásobník alebo kondenzátor, nedokáže prúd \"uložiť\". Chráni obvod tým, že sa zničí a preruší ho." }
        ]
    },
    {
        question: "Sú úplne všetky ochranné ističe elektrických obvodov konštrukčne založené na tepelných účinkoch prúdu?",
        options: [
            { text: "Nie, okrem tepelných poistiek sa používajú aj iné ističe, ktorých fyzikálny princíp je odlišný a nie je založený na teple.", isCorrect: true, feedback: "" },
            { text: "Áno, každý jeden ochranný prvok musí nevyhnutne obsahovať tavný drôtik, inak nie je možné prerušiť preťažený obvod.", isCorrect: false, feedback: "Existujú aj ističe fungujúce napríklad na elektromagnetickom princípe, ktoré neobsahujú tavný drôtik." },
            { text: "Nie, moderné poistky reagujú výlučne na zmenu tlaku okolitého vzduchu spôsobeného nárastom elektrického poľa.", isCorrect: false, feedback: "Ističe nereagujú na zmeny tlaku vzduchu; využívajú buď tepelné, alebo elektromagnetické vlastnosti prechádzajúceho prúdu." },
            { text: "Áno, generovanie Joulovho tepla je vo fyzike jediný známy a konštrukčne aplikovateľný jav schopný reagovať na skrat.", isCorrect: false, feedback: "Ako istič môže fungovať aj elektromagnet, ktorý pri silnom prúde mechanicky rozpojí obvod (elektromagnetický účinok)." }
        ]
    },
    {
        question: "Ktorý vzorec správne určuje Joulovo teplo ($Q_J$), ak chceme vo výpočte použiť len napätie ($U$), odpor ($R$) a čas ($t$)?",
        options: [
            { text: "$Q_J = \\frac{U^2}{R} t$", isCorrect: true, feedback: "" },
            { text: "$Q_J = \\frac{R^2}{U} t$", isCorrect: false, feedback: "Tento vzťah je nesprávny. Ak do vzťahu $UIt$ dosadíme Ohmov zákon ($I = U/R$), dostaneme vzorec so štvorcom napätia v čitateli." },
            { text: "$Q_J = U R t$", isCorrect: false, feedback: "Elektrická energia sa nepočíta ako súčin napätia a odporu. Týmto by sme dostali úplne iné fyzikálne jednotky." },
            { text: "$Q_J = \\frac{U}{R^2} t$", isCorrect: false, feedback: "Vo vzorci musí byť na druhú umocnené napätie ($U^2$), nie odpor ($R^2$)." }
        ]
    },
    {
        question: "Čo presne označuje termín „Joulovo teplo“ v kontexte elektrického obvodu?",
        options: [
            { text: "Predstavuje energiu, ktorá je prenesená k tepelnej výmene medzi zohriatym vodičom a jeho okolím.", isCorrect: true, feedback: "" },
            { text: "Je to celková užitočná mechanická práca, ktorú dokáže vykonať pripojený spotrebič za určitý časový úsek.", isCorrect: false, feedback: "Joulovo teplo sa vzťahuje len na premenu elektrickej energie na energiu tepelnú (vnútornú), nie na mechanickú prácu." },
            { text: "Ide o špecifické množstvo elektrického náboja, ktoré zostane vo vnútri vodiča bezprostredne po jeho odpojení zo siete.", isCorrect: false, feedback: "Teplo je forma odovzdanej energie, v žiadnom prípade nie je totožné so statickým elektrickým nábojom." },
            { text: "Definuje kritický rozdiel teplôt medzi vnútorným odporom zdroja napätia a chladiacim obalom spotrebiča.", isCorrect: false, feedback: "Joulovo teplo nie je teplotný rozdiel (meraný v Kelvinoch alebo Celsioch), je to energia meraná v Jouloch." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        setTimeout(function() { advanceToNext(); }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) {
        btn.classList.add('visible');
        btn.focus();
    }
}

function advanceToNext() {
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) closeModal();
    }
});
document.getElementById('restartBtn').addEventListener('click', function() { initQuiz(); });

initQuiz();
</script>
</body>
</html>
