<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektrický odpor - Test A</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center; color: #fff; margin-bottom: 8px;
            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }
        .progress-wrapper {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px; transition: width 0.4s ease; width: 0%;
        }
        .question-card {
            background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .question-card.active { display: block; }
        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.95em; line-height: 1.4; color: #333;
        }
        .option-item:hover { border-color: #667eea; background: #f0f0ff; }
        .option-item.correct {
            border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 600;
        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 28px; font-size: 1em; border-radius: 25px;
            cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
            float: right; pointer-events: auto;
        }
        .next-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .next-btn.visible { display: inline-block; }
        .results-card {
            background: #fff; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .results-card h2 { font-size: 1.6em; margin-bottom: 10px; color: #333; }
        .results-score { font-size: 2.8em; font-weight: 700; margin: 20px 0; }
        .results-score.excellent { color: #4caf50; }
        .results-score.good { color: #ff9800; }
        .results-score.poor { color: #f44336; }
        .results-message { font-size: 1.05em; margin-bottom: 30px; color: #555; }
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 14px 40px; font-size: 1.05em; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { color: #f44336; margin-bottom: 12px; font-size: 1.2em; }
        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Elektrický odpor</h1>
        <div class="subtitle">Test A</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="quizContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Výsledky testu</h2>
            <div class="results-score" id="resultsScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="restart-btn" id="restartBtn">Skúsiť znova</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>Nesprávna odpoveď</h3>
            <p id="modalText"></p>
            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>
        </div>
    </div>

<script>
const questionsData = [
    {
        question: "Čo je mikroskopickou príčinou existencie elektrického odporu v kovových vodičoch?",
        options: [
            { text: "Zrážky vodivostných elektrónov s iónmi kryštálovej mriežky v dôsledku ich tepelného pohybu.", isCorrect: true, feedback: "" },
            { text: "Vzájomné odpudzovanie vodivostných elektrónov v dôsledku ich rovnakého elektrického náboja.", isCorrect: false, feedback: "Odpudzovanie elektrónov priamo nespôsobuje elektrický odpor, ten vzniká interakciou tečúcich elektrónov s iónmi mriežky." },
            { text: "Príťažlivé sily medzi iónmi mriežky, ktoré bránia toku elektrického prúdu.", isCorrect: false, feedback: "Sily medzi iónmi udržujú mriežku pokope. Prúd tvoria voľné elektróny, ktorým v pohybe bránia samotné zrážky s kmitajúcimi iónmi." },
            { text: "Spomaľovanie elektrónov vplyvom magnetického poľa vznikajúceho okolo pretekajúceho prúdu.", isCorrect: false, feedback: "Vlastné magnetické pole vodiča nemá primárny vplyv na vznik Ohmického elektrického odporu materiálu." }
        ]
    },
    {
        question: "Aký je vzťah medzi elektrickým odporom vodiča a jeho prierezom pri konštantnej teplote?",
        options: [
            { text: "Odpor je nepriamo úmerný prierezu vodiča. Tenší vodič má väčší odpor.", isCorrect: true, feedback: "" },
            { text: "Odpor je priamo úmerný prierezu vodiča. Hrubší vodič má väčší odpor.", isCorrect: false, feedback: "Je to naopak. Hrubší vodič poskytuje viac \"priestoru\" pre tok elektrónov, čím sa prekážky minimalizujú a odpor sa zmenšuje." },
            { text: "Odpor nezávisí od prierezu vodiča, mení sa iba so zmenou jeho dĺžky.", isCorrect: false, feedback: "Geometria vodiča zahŕňa tak dĺžku, ako aj plochu prierezu. Podľa vzťahu R = ρ(l/S) ovplyvňujú odpor obe veličiny." },
            { text: "Odpor klesá s druhou mocninou prierezu vodiča.", isCorrect: false, feedback: "Závislosť medzi odporom a prierezom je lineárne nepriamo úmerná (vzorec obsahuje iba S, nie S na druhú)." }
        ]
    },
    {
        question: "Prečo sa elektrický odpor kovových vodičov so zvyšujúcou sa teplotou zväčšuje?",
        options: [
            { text: "Zväčšujú sa rozkmity kmitajúcich iónov mriežky, čím nastávajú častejšie zrážky s elektrónmi.", isCorrect: true, feedback: "" },
            { text: "Teplom sa zmenšuje počet voľných elektrónov v kove, čo sťažuje prenos elektrického náboja.", isCorrect: false, feedback: "Počet voľných elektrónov v kovoch sa so zvýšenou teplotou výrazne nemení, mení sa však intenzita pohybu iónov mriežky." },
            { text: "Tepelný pohyb spomaľuje rýchlosť samotných iónov, čím fyzicky brzdia elektrický prúd.", isCorrect: false, feedback: "Ióny sa mriežkou neposúvajú a netvoria elektrický prúd. Prúd tvoria elektróny, ktoré narážajú do rýchlejšie kmitajúcich iónov." },
            { text: "Zvyšovaním teploty klesá objem vodiča, čím sa elektróny v štruktúre ťažšie pohybujú.", isCorrect: false, feedback: "Kovy sa teplom zvyčajne rozťahujú (zväčšujú objem). Príčinou rastu odporu sú tepelné kmity iónov." }
        ]
    },
    {
        question: "Na čo sa v elektrotechnike využívajú zliatiny s malou hodnotou teplotného súčiniteľa odporu (napr. konštantán)?",
        options: [
            { text: "Na výrobu tzv. odporových normálov, keďže ich závislosť od teploty je veľmi malá.", isCorrect: true, feedback: "" },
            { text: "Na výrobu vlákien do žiaroviek, aby pri zahriatí dosahovali výraznú svietivosť.", isCorrect: false, feedback: "Na vlákna žiaroviek sa používa volfrám kvôli jeho extrémne vysokej teplote topenia, nie kvôli malému teplotnému súčiniteľu." },
            { text: "Na výrobu supravodičov, pretože pri izbovej teplote úplne strácajú elektrický odpor.", isCorrect: false, feedback: "Supravodivosť nastáva len pri extrémne nízkych teplotách a u špecifických materiálov, nemá súvislosť s malým teplotným súčiniteľom pri izbovej teplote." },
            { text: "Na lokálne zosilnenie elektrického prúdu v miestach s abnormálne vysokou teplotou.", isCorrect: false, feedback: "Pasívne zliatiny prúd nezosilňujú. Ich hlavnou výhodou je stabilita hodnoty odporu voči teplotným zmenám." }
        ]
    },
    {
        question: "Čo presne definuje jav nazývaný supravodivosť?",
        options: [
            { text: "Náhly pokles elektrického odporu látky na nulu po jej ochladení pod kritickú teplotu.", isCorrect: true, feedback: "" },
            { text: "Plynulé znižovanie elektrického odporu kovu až na polovičnú hodnotu blízko absolútnej nuly.", isCorrect: false, feedback: "Pri supravodivosti odpor neklesá iba plynule na polovicu, ale za kritickou hranicou skokovo padá úplne na nulu." },
            { text: "Extrémne zvýšenie vodivosti materiálu po jeho prudkom zahriatí nad kritickú teplotu.", isCorrect: false, feedback: "Supravodivý stav nevzniká zahrievaním, ale naopak prudkým ochladením materiálu na veľmi nízke teploty." },
            { text: "Schopnosť materiálu viesť elektrický prúd bez zrážok elektrónov už pri bežnej izbovej teplote.", isCorrect: false, feedback: "Supravodivosť sa dodnes nepodarilo dosiahnuť pri izbových teplotách; vyžaduje chladenie, napr. pomocou kvapalného hélia." }
        ]
    },
    {
        question: "Ako sa zmení celkový elektrický prúd v obvode, ak doň k pôvodnému rezistoru postupne pridávame ďalšie rezistory zapojené sériovo (za sebou)?",
        options: [
            { text: "Elektrický prúd sa bude zmenšovať, pretože pridávaním rezistorov do série rastie celkový odpor.", isCorrect: true, feedback: "" },
            { text: "Elektrický prúd v obvode sa bude zväčšovať, pretože pridávame viac vodivých prvkov.", isCorrect: false, feedback: "Pri sériovom zapojení sa prekážky (jednotlivé odpory) sčítavajú. Využíva sa rovnaká trasa, takže odpor rastie a prúd musí klesať." },
            { text: "Elektrický prúd zostane rovnaký, zmení sa len celkové napätie čerpané zo zdroja.", isCorrect: false, feedback: "Napätie zdroja (napr. batérie) zostáva v praxi zhruba konštantné. Prúd sa musí prispôsobiť zväčšenému odporu podľa Ohmovho zákona." },
            { text: "Elektrický prúd bude klesať, avšak výhradne kvôli tomu, že sa sériovým zapojením zmenšuje odpor.", isCorrect: false, feedback: "Prúd síce klesá, ale dôvod uvedený v odpovedi je chybný. Sériovým zapojením sa celkový odpor naopak zväčšuje." }
        ]
    },
    {
        question: "Ktorý z nasledujúcich vzťahov správne vyjadruje závislosť elektrického odporu kovového vodiča od teploty?",
        options: [
            { text: "$R = R_0(1 + \\alpha \\Delta t)$", isCorrect: true, feedback: "" },
            { text: "$R = R_0(1 - \\alpha \\Delta t)$", isCorrect: false, feedback: "Tento vzťah by matematicky znamenal, že odpor s rastúcou teplotou klesá, čo pri čistých kovoch neplatí." },
            { text: "$R = \\alpha(R_0 + \\Delta t)$", isCorrect: false, feedback: "Ide o nesprávny zápis závislosti. Pôvodný odpor $R_0$ sa musí násobiť jedničkou plus pomernou zmenou." },
            { text: "$R = R_0 \\cdot \\alpha \\cdot \\Delta t$", isCorrect: false, feedback: "Tento výraz ($R_0 \\cdot \\alpha \\cdot \\Delta t$) udáva iba hodnotu samotného nárastu (prírastku) odporu, nie výsledný celkový odpor." }
        ]
    },
    {
        question: "Pri školskom experimente zahrievame plameňom sviečky železnú špirálu zaradenú v obvode so žiarovkou. Čo budeme pozorovať?",
        options: [
            { text: "Zväčšenie odporu špirály, čo spôsobí pokles prúdu a následné zníženie svietivosti žiarovky.", isCorrect: true, feedback: "" },
            { text: "Zmenšenie odporu špirály, čo spôsobí nárast prúdu a podstatne silnejšie svietenie žiarovky.", isCorrect: false, feedback: "Kovové vodiče, akým je aj železo, pri zahrievaní svoj odpor zvyšujú, elektrický prúd v obvode preto nemôže narásť." },
            { text: "Odpor zostane nezmenený, žiarovka však zhasne, pretože teplo naruší magnetické pole špirály.", isCorrect: false, feedback: "Magnetické pole nie je príčinou zmeny svietivosti v tomto experimente. Podstatou je čisto termická zmena elektrického odporu." },
            { text: "Odpor klesne na nulu, pretože pri zahrievaní sa v železe prudko uvoľní viac vodivostných elektrónov.", isCorrect: false, feedback: "Uvoľnenie väčšieho množstva elektrónov po zahriatí je typické pre polovodiče. Pri kovoch prevláda brzdiaci efekt z kmitajúcich iónov." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        setTimeout(function() { advanceToNext(); }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) {
        btn.classList.add('visible');
        btn.focus();
    }
}

function advanceToNext() {
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) closeModal();
    }
});
document.getElementById('restartBtn').addEventListener('click', function() { initQuiz(); });

initQuiz();
</script>
</body>
</html>
