<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívny Test</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center; color: #fff; margin-bottom: 8px;
            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }
        .progress-wrapper {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px; transition: width 0.4s ease; width: 0%;
        }
        .question-card {
            background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .question-card.active { display: block; }
        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.95em; line-height: 1.4; color: #333;
        }
        .option-item:hover { border-color: #667eea; background: #f0f0ff; }
        .option-item.correct {
            border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 600;
        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 28px; font-size: 1em; border-radius: 25px;
            cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
            float: right; pointer-events: auto;
        }
        .next-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .next-btn.visible { display: inline-block; }
        .results-card {
            background: #fff; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .results-card h2 { font-size: 1.6em; margin-bottom: 10px; color: #333; }
        .results-score { font-size: 2.8em; font-weight: 700; margin: 20px 0; }
        .results-score.excellent { color: #4caf50; }
        .results-score.good { color: #ff9800; }
        .results-score.poor { color: #f44336; }
        .results-message { font-size: 1.05em; margin-bottom: 30px; color: #555; }
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 14px 40px; font-size: 1.05em; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { color: #f44336; margin-bottom: 12px; font-size: 1.2em; }
        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Zahrievanie vodiča elektrickým prúdom</h1>
        <div class="subtitle">Test B</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="quizContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Výsledky testu</h2>
            <div class="results-score" id="resultsScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="restart-btn" id="restartBtn">Skúsiť znova</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>Nesprávna odpoveď</h3>
            <p id="modalText"></p>
            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>
        </div>
    </div>

<script>
const questionsData = [
    {
        question: "Aký matematický vzťah definuje prácu síl elektrického poľa ($W$) pri prenesení náboja $Q$ medzi svorkami s napätím $U$?",
        options: [
            { text: "$W = QU$", isCorrect: true, feedback: "" },
            { text: "$W = \\frac{Q}{U}$", isCorrect: false, feedback: "Práca poľa je priamo úmerná veľkosti preneseného náboja aj danému napätiu, ide o ich súčin, nie podiel." },
            { text: "$W = \\frac{U}{Q}$", isCorrect: false, feedback: "Tento vzťah nedáva fyzikálny zmysel. Veľkosť práce sa získa násobením napätia a množstva preneseného náboja." },
            { text: "$W = Q^2U$", isCorrect: false, feedback: "Náboj $Q$ nevystupuje vo vzorci pre prácu elektrického poľa v druhej mocnine." }
        ]
    },
    {
        question: "Za akej konkrétnej podmienky je vzniknuté Joulovo teplo ($Q_J$) vo vodiči úplne rovné celkovej elektrickej práci ($W$)?",
        options: [
            { text: "Ak v elektrickom obvode nedochádza k žiadnym iným premenám elektrickej energie (napr. na mechanickú prácu).", isCorrect: true, feedback: "" },
            { text: "Iba v prípade, ak je vnútorný odpor zdroja striktne väčší ako celkový odpor samotného spotrebiča.", isCorrect: false, feedback: "Rovnosť $Q_J = W$ platí vďaka absencii iných foriem premeny energie, nie na základe pomeru odporov v obvode." },
            { text: "Ak sa elektromotorické napätie v obvode periodicky mení priamo úmerne so zvyšujúcim sa prúdom.", isCorrect: false, feedback: "Pre rovnosť práce a tepla je určujúci výlučne druh spotrebiča (čisto tepelný účinok), nie oscilácia napätia." },
            { text: "Len v otvorených obvodoch, ktoré neobsahujú vôbec žiadne elektrické spotrebiče s odporom.", isCorrect: false, feedback: "V otvorenom obvode neprechádza prúd, takže sa nekoná vôbec žiadna elektrická práca a nevzniká Joulovo teplo." }
        ]
    },
    {
        question: "Ktorý z nasledujúcich vzťahov správne vyjadruje elektrický výkon ($P$) v spotrebiči s využitím Ohmovho zákona cez odpor ($R$) a prúd ($I$)?",
        options: [
            { text: "$P = RI^2$", isCorrect: true, feedback: "" },
            { text: "$P = R^2I$", isCorrect: false, feedback: "Do základného vzťahu $P=UI$ musíme dosadiť $U=RI$, z čoho po roznásobení vznikne $R \\cdot I^2$. Prúd musí byť na druhú, nie odpor." },
            { text: "$P = \\frac{R}{I^2}$", isCorrect: false, feedback: "Výkon je úmerný priamemu súčinu odporu a štvorca prúdu, nesmie sa tam deliť." },
            { text: "$P = U^2R$", isCorrect: false, feedback: "Ak vo vzorci použijeme len napätie a odpor, správny vzťah je $P = U^2/R$. V tomto distraktore je nesprávne použité násobenie." }
        ]
    },
    {
        question: "Čím je presne určená účinnosť premien energie ($\\eta$) v štandardnom elektrickom obvode?",
        options: [
            { text: "Je daná pomerom napätia na vonkajšej časti obvodu ($U$) a elektromotorického napätia zdroja ($U_e$).", isCorrect: true, feedback: "" },
            { text: "Definuje sa ako celkový súčin prúdu prechádzajúceho obvodom a elektromotorického napätia zdroja.", isCorrect: false, feedback: "Súčin napätia a prúdu vyjadruje výkon, nie účinnosť. Účinnosť je pomer (bezrozmerné číslo) udávajúci mieru využitia." },
            { text: "Je to podiel prevrátených hodnôt elektromotorického napätia zdroja ku svorkovému napätiu spotrebiča.", isCorrect: false, feedback: "Ide o priamy pomer $U / U_e$. Keby bol $U_e$ v čitateli, účinnosť reálneho obvodu by matematicky presahovala 100%." },
            { text: "Rovná sa percentuálnemu rozdielu medzi celkovou prácou batérie a tepelnými stratami na jej izolácii.", isCorrect: false, feedback: "Účinnosť sa nepočíta z tepelných strát izolácie batérie, ale primárne z pomeru úžitkového napätia k celkovému elektromotorickému napätiu." }
        ]
    },
    {
        question: "Na akom princípe využívajú klasické halogénové žiarovky tepelné účinky elektrického prúdu na tvorbu svetla?",
        options: [
            { text: "Prechádzajúci elektrický prúd rozžeraví vlákno žiarovky na takú vysokú teplotu, že začne vyžarovať svetlo.", isCorrect: true, feedback: "" },
            { text: "Prúd priamo excituje plyn v banke žiarovky, čo spôsobuje okamžité vyžarovanie studeného svetla bez vzniku tepla.", isCorrect: false, feedback: "Toto je princíp neónových trubíc alebo žiariviek. Klasická (aj halogénová) žiarovka svieti vďaka vysokému Joulovmu teplu na vlákne." },
            { text: "Volfrámové vlákno pohlcuje okolitú izbovú teplotu a chemickou reakciou ju premieňa na viditeľné elektromagnetické žiarenie.", isCorrect: false, feedback: "Žiarovka generuje vlastné teplo priamo prechádzajúcim elektrickým prúdom, nemá ako pohlcovať energiu z chladnejšieho okolia." },
            { text: "Zrážky elektrónov vo vákuu žiarovky štiepia atómy plynu, čím dochádza k uvoľňovaniu fotónov v spektre viditeľného svetla.", isCorrect: false, feedback: "Žiarovka nefunguje na jadrovom štiepení, využíva čisto odporové teplo vlákna. Halogénový plyn iba spomaľuje vyparovanie vlákna." }
        ]
    },
    {
        question: "Ktoré z nižšie uvedených zariadení primárne NEVYUŽÍVA priamu premenu elektrickej energie na tepelnú energiu?",
        options: [
            { text: "Vibračný motorček v mobilnom telefóne.", isCorrect: true, feedback: "" },
            { text: "Sušič na vlasy (fén).", isCorrect: false, feedback: "Fén obsahuje výhrevnú špirálu, ktorej jedinou primárnou funkciou je priama premena elektrickej energie na Joulovo teplo." },
            { text: "Elektrická varná kanvica.", isCorrect: false, feedback: "Varná kanvica funguje priamo na princípe odporového drôtu, ktorý pri prechode prúdu zahrieva vodu." },
            { text: "Elektrický bojler na ohrev vody.", isCorrect: false, feedback: "Elektrický bojler je typický tepelný spotrebič, ktorý premieňa energiu elektrického poľa na vnútornú energiu vody." }
        ]
    },
    {
        question: "Čo sa deje s celkovou energiou, ktorú dodáva elektrický zdroj do kompletného uzavretého obvodu?",
        options: [
            { text: "Časť energie sa spotrebuje vo vonkajšej časti obvodu s odporom $R$ a zvyšná časť sa spotrebuje na vnútornom odpore zdroja $R_i$.", isCorrect: true, feedback: "" },
            { text: "Celková energia sa bezstratovo prenáša a spotrebuje sa výhradne na pripojenom vonkajšom spotrebiči.", isCorrect: false, feedback: "V reálnych podmienkach má každý zdroj (batéria) svoj vlastný vnútorný odpor, na ktorom sa vždy stratí (spotrebuje) určitá časť energie." },
            { text: "Energia cirkuluje obvodom bez zmeny veľkosti, pričom spotrebiče využívajú iba frekvenciu elektrického poľa, nie energiu samotnú.", isCorrect: false, feedback: "Spotrebiče fyzicky konvertujú dodanú elektrickú energiu na iné formy (teplo, práca), takže ju reálne a priamo spotrebúvajú." },
            { text: "Dodaná energia sa v plnej miere premieňa na kinetickú prácu iónov batérie, zatiaľ čo spotrebič čerpá energiu priamo z voľného okolia.", isCorrect: false, feedback: "Elektrický prúd prenáša energiu priamo zo zdroja do spotrebiča cez vodiče. Spotrebič nečerpá energiu voľne z okolia." }
        ]
    },
    {
        question: "Akým vzťahom možno vyjadriť účinnosť obvodu ($\\eta$), ak poznáme odpor vonkajšieho spotrebiča ($R$) a vnútorný odpor zdroja ($R_i$)?",
        options: [
            { text: "$\\eta = \\frac{R}{R + R_i}$", isCorrect: true, feedback: "" },
            { text: "$\\eta = \\frac{R_i}{R + R_i}$", isCorrect: false, feedback: "Tento vzorec by nevypočítal užitočnú účinnosť spotrebiča, ale presne naopak - vypočítal by percento energie stratenej vo vnútri zdroja." },
            { text: "$\\eta = \\frac{R + R_i}{R}$", isCorrect: false, feedback: "Účinnosť premien energie vyjadrená v percentách (alebo desatinným číslom) nemôže presiahnuť 1. Tento zlomok by mal hodnotu vždy väčšiu ako 1." },
            { text: "$\\eta = \\frac{R}{R_i}$", isCorrect: false, feedback: "Pre správny výpočet účinnosti obvodu je nutné v menovateli použiť celkový odpor celého obvodu ($R + R_i$), nielen samostatný odpor zdroja." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        setTimeout(function() { advanceToNext(); }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) {
        btn.classList.add('visible');
        btn.focus();
    }
}

function advanceToNext() {
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) closeModal();
    }
});
document.getElementById('restartBtn').addEventListener('click', function() { initQuiz(); });

initQuiz();
</script>
</body>
</html>
