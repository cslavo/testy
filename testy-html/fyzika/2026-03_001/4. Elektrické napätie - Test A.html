<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívny Test</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center; color: #fff; margin-bottom: 8px;
            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }
        .progress-wrapper {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px; transition: width 0.4s ease; width: 0%;
        }
        .question-card {
            background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .question-card.active { display: block; }
        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.95em; line-height: 1.4; color: #333;
        }
        .option-item:hover { border-color: #667eea; background: #f0f0ff; }
        .option-item.correct {
            border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 600;
        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 28px; font-size: 1em; border-radius: 25px;
            cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
            float: right; pointer-events: auto;
        }
        .next-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .next-btn.visible { display: inline-block; }
        .results-card {
            background: #fff; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .results-card h2 { font-size: 1.6em; margin-bottom: 10px; color: #333; }
        .results-score { font-size: 2.8em; font-weight: 700; margin: 20px 0; }
        .results-score.excellent { color: #4caf50; }
        .results-score.good { color: #ff9800; }
        .results-score.poor { color: #f44336; }
        .results-message { font-size: 1.05em; margin-bottom: 30px; color: #555; }
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 14px 40px; font-size: 1.05em; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { color: #f44336; margin-bottom: 12px; font-size: 1.2em; }
        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Elektrické napätie</h1>
        <div class="subtitle">Test A</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="quizContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Výsledky testu</h2>
            <div class="results-score" id="resultsScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="restart-btn" id="restartBtn">Skúsiť znova</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>Nesprávna odpoveď</h3>
            <p id="modalText"></p>
            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>
        </div>
    </div>

<script>
const questionsData = [
    {
        question: "Ako je presne definované elektrické napätie $U$ medzi dvoma bodmi elektrického poľa?",
        options: [
            { text: "Je určené podielom práce W vykonanej elektrickou silou a elektrického náboja Q preneseného medzi týmito bodmi.", isCorrect: true, feedback: "" },
            { text: "Je určené súčinom práce W vykonanej elektrickou silou a elektrického náboja Q.", isCorrect: false, feedback: "Nesprávne. Napätie sa nevypočíta ako súčin, ale ako podiel ($W / Q$). Zväčšovaním preneseného náboja pri konštantnom napätí rastie len vykonaná práca, nie napätie samotné." },
            { text: "Je určené podielom elektrického náboja Q a práce W vykonanej elektrickou silou.", isCorrect: false, feedback: "Nesprávne. Ide o obrátený pomer. Správny vzorec je $U = W / Q$, teda vykonaná práca sa delí veľkosťou preneseného náboja, nie naopak." },
            { text: "Je určené rozdielom potenciálnej energie a práce W vykonanej na náboji Q.", isCorrect: false, feedback: "Nesprávne. Samotná definícia napätia uvedená v učive je postavená striktne na podiele vykonanej práce a veľkosti preneseného náboja." }
        ]
    },
    {
        question: "Ako je definovaná jednotka elektrického napätia (volt) pomocou základnejších fyzikálnych jednotiek v súlade s definíciou napätia?",
        options: [
            { text: "$1\\,\\text{J}\\cdot\\text{C}^{-1}$", isCorrect: true, feedback: "" },
            { text: "$1\\,\\text{C}\\cdot\\text{J}^{-1}$", isCorrect: false, feedback: "Nesprávne. Tento zápis znamená Coulomb na Joule, čo je prevrátená hodnota správnej jednotky. Volt je Joule na Coulomb." },
            { text: "$1\\,\\text{W}\\cdot\\text{s}$", isCorrect: false, feedback: "Nesprávne. Wattsekunda (W·s) je jednotka práce resp. energie (zodpovedá 1 Joulu), nejedná sa o jednotku elektrického napätia." },
            { text: "$1\\,\\text{N}\\cdot\\text{C}^{-1}$", isCorrect: false, feedback: "Nesprávne. Newton na Coulomb je jednotka intenzity elektrického poľa, definujúca silu pôsobiacu na náboj, nie elektrické napätie." }
        ]
    },
    {
        question: "Od čoho závisí elektrické napätie medzi dvoma bodmi elektrického poľa?",
        options: [
            { text: "Nezávisí od veľkosti prenášaného náboja ani od trajektórie, ale výlučne od polohy obidvoch bodov v poli.", isCorrect: true, feedback: "" },
            { text: "Závisí od tvaru trajektórie pohybu náboja a priamo úmerne od jeho celkovej veľkosti.", isCorrect: false, feedback: "Nesprávne. Elektrické pole je konzervatívne, práca (a teda aj napätie) nezávisí od tvaru trajektórie, a priamo z definície napätie nezávisí od prenášaného náboja." },
            { text: "Nezávisí od polohy bodov v poli, ale priamo úmerne závisí len od veľkosti preneseného náboja.", isCorrect: false, feedback: "Nesprávne. Poloha bodov je naopak jediná vec, od ktorej napätie reálne závisí. Od náboja napätie poľa nezávisí." },
            { text: "Závisí výhradne od elektrického odporu prostredia medzi dvoma bodmi a od času prenosu náboja.", isCorrect: false, feedback: "Nesprávne. V definícii elektrického napätia v poli čas a odpor prostredia nehrajú rolu. Ide čisto o energetický stav medzi dvoma bodmi." }
        ]
    },
    {
        question: "Akým spôsobom sa podľa učiva správne zapája merací prístroj (voltmeter) do elektrického obvodu, ak chceme zmerať napätie na spotrebiči?",
        options: [
            { text: "Zapája sa paralelne k spotrebiču.", isCorrect: true, feedback: "" },
            { text: "Zapája sa sériovo za spotrebič v smere toku prúdu.", isCorrect: false, feedback: "Nesprávne. Sériovo do obvodu sa zapája ampérmeter na meranie prúdu. Voltmeter sa musí pripojiť paralelne." },
            { text: "Zapája sa paralelne k zdroju, ale prísne sériovo k spotrebiču.", isCorrect: false, feedback: "Nesprávne. Voltmeter sa vždy pripája priamo paralelne k tým dvom bodom (napríklad k svorkám spotrebiča), medzi ktorými chceme napätie merať." },
            { text: "Zapája sa priamo do uzla obvodu bez ohľadu na pripojený spotrebič.", isCorrect: false, feedback: "Nesprávne. Uzol predstavuje len jeden bod. Napätie je rozdiel elektrických potenciálov, voltmeter sa musí pripojiť vždy k dvom rôznym bodom obvodu." }
        ]
    },
    {
        question: "Čo presne vyjadruje pojem \"merací rozsah\" na voltmetri alebo digitálnom multimetri?",
        options: [
            { text: "Predstavuje maximálnu hodnotu napätia, ktorú je prístroj schopný pri danom nastavení odmerať.", isCorrect: true, feedback: "" },
            { text: "Predstavuje minimálnu prahovú hodnotu, od ktorej prístroj vôbec začína zaznamenávať elektrické napätie.", isCorrect: false, feedback: "Nesprávne. Rozsah neurčuje minimálny prah citlivosti, ale vrchný limit (maximálnu hodnotu), ktorú je prístroj schopný bez preťaženia zmerať." },
            { text: "Znamená zaručený interval napätia, v ktorom je relatívna odchýlka merania prístroja presne nulová.", isCorrect: false, feedback: "Nesprávne. Žiadne fyzikálne meranie, nech je v akomkoľvek rozsahu, nie je bez chyby (nemá nulovú odchýlku)." },
            { text: "Predstavuje percentuálnu presnosť, akou prístroj meria napätie v celom zmeranom elektrickom obvode.", isCorrect: false, feedback: "Nesprávne. Percentuálna presnosť súvisí s chybou a triedou presnosti prístroja, zatiaľ čo rozsah vyjadruje konkrétnu maximálnu merateľnú hodnotu v danej fyzikálnej jednotke (napr. 200 V)." }
        ]
    },
    {
        question: "Je fyzikálne možné zmerať elektrické napätie priamo na elektrickom zdroji bez prítomnosti akéhokoľvek spotrebiča v obvode?",
        options: [
            { text: "Áno, elektrické napätie je možné odmerať priamym pripojením voltmetra na svorky samotného elektrického zdroja.", isCorrect: true, feedback: "" },
            { text: "Nie, voltmeter musí byť vždy zapojený len cez spotrebič, inak by pretekaním prúdu došlo k okamžitému skratu zdroja.", isCorrect: false, feedback: "Nesprávne. Toto tvrdenie platí pre ampérmeter. Voltmeter má veľmi vysoký vnútorný odpor a zapojením priamo k zdroju skrat nespôsobí, nameria takzvané elektromotorické napätie." },
            { text: "Áno, je to možné, ale iba v prípade, že je zdroj úplne vybitý a generuje len statické napätie.", isCorrect: false, feedback: "Nesprávne. Priamo na svorkách sa dá merať napätie plne nabitého aj bežne fungujúceho zdroja (napr. 1,5 V batérie)." },
            { text: "Nie, napätie zdroja bez spotrebiča nemožno priamo merať, dá sa iba teoreticky vypočítať z Ohmova zákona.", isCorrect: false, feedback: "Nesprávne. Učivo v kapitole \"Praktické cvičenie\" priamo udáva za úlohu odmerať napätie priamym pripojením voltmetra k svorkám elektrického zdroja." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        setTimeout(function() { advanceToNext(); }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) { btn.classList.add('visible'); btn.focus(); }
}

function advanceToNext() {
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) { closeModal(); }
    }
});

document.getElementById('restartBtn').addEventListener('click', function() { initQuiz(); });

initQuiz();
</script>
</body>
</html>
