<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívny Test</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center; color: #fff; margin-bottom: 8px;
            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }
        .progress-wrapper {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px; transition: width 0.4s ease; width: 0%;
        }
        .question-card {
            background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .question-card.active { display: block; }
        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.95em; line-height: 1.4; color: #333;
        }
        .option-item:hover { border-color: #667eea; background: #f0f0ff; }
        .option-item.correct {
            border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 600;
        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 28px; font-size: 1em; border-radius: 25px;
            cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
            float: right; pointer-events: auto;
        }
        .next-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .next-btn.visible { display: inline-block; }
        .results-card {
            background: #fff; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .results-card h2 { font-size: 1.6em; margin-bottom: 10px; color: #333; }
        .results-score { font-size: 2.8em; font-weight: 700; margin: 20px 0; }
        .results-score.excellent { color: #4caf50; }
        .results-score.good { color: #ff9800; }
        .results-score.poor { color: #f44336; }
        .results-message { font-size: 1.05em; margin-bottom: 30px; color: #555; }
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 14px 40px; font-size: 1.05em; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { color: #f44336; margin-bottom: 12px; font-size: 1.2em; }
        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ohmov zákon pre uzavretý elektrický obvod</h1>
        <div class="subtitle">Test B</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="quizContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Výsledky testu</h2>
            <div class="results-score" id="resultsScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="restart-btn" id="restartBtn">Skúsiť znova</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>Nesprávna odpoveď</h3>
            <p id="modalText"></p>
            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>
        </div>
    </div>

<script>
const questionsData = [
    {
        question: "Čo sa stane s hodnotou napätia na póloch batérie po tom, ako k nej pripojíme spotrebič (zaťažíme ju)?",
        options: [
            { text: "Jej hodnota bude menšia ako pôvodné elektromotorické napätie zdroja.", isCorrect: true, feedback: "" },
            { text: "Jej hodnota sa nezmení a zostane na úrovni napätia naprázdno.", isCorrect: false, feedback: "Akonáhle obvodom začne pretekať prúd, vzniká úbytok napätia na vnútornom odpore zdroja, a preto napätie na póloch klesne." },
            { text: "Jej hodnota sa dočasne zvýši nad úroveň elektromotorického napätia.", isCorrect: false, feedback: "Fyzikálne nie je možné, aby pasívne pripojenie spotrebiča zvýšilo pôvodné napätie zdroja." },
            { text: "Hodnota napätia na póloch batérie bude presne rovná $0\\ V$.", isCorrect: false, feedback: "Napätie by kleslo na 0 V iba v prípade ideálneho skratu bez vonkajšieho odporu, bežný spotrebič napätie iba zníži, nevyruší ho úplne." }
        ]
    },
    {
        question: "Čo v uzavretom elektrickom obvode vyjadruje veličina definovaná vzťahom $U_i = R_i \\cdot I$?",
        options: [
            { text: "Úbytok napätia na zdroji.", isCorrect: true, feedback: "" },
            { text: "Svorkové napätie obvodu.", isCorrect: false, feedback: "Svorkové napätie sa označuje ako $U$ a počíta sa ako súčin vonkajšieho odporu a prúdu ($R \\cdot I$)." },
            { text: "Elektromotorické napätie naprázdno.", isCorrect: false, feedback: "Elektromotorické napätie ($U_e$) nezávisí od pretekajúceho prúdu tak, ako je to definované v uvedenom vzťahu pre úbytok." },
            { text: "Tepelný výkon stratený vo vnútri zdroja.", isCorrect: false, feedback: "Vzťah definuje napätie vo Voltoch, nie výkon vo Wattoch." }
        ]
    },
    {
        question: "Ktoré prvky sú zodpovedné za tvorbu tzv. vonkajšej časti uzavretého elektrického obvodu?",
        options: [
            { text: "Spotrebiče, pripojovacie vodiče a podobne.", isCorrect: true, feedback: "" },
            { text: "Priestor medzi dvoma pólmi vo vnútri plochej batérie.", isCorrect: false, feedback: "Tento priestor tvorí vnútornú časť obvodu a definuje vnútorný odpor $R_i$." },
            { text: "Iba ističe a poistky.", isCorrect: false, feedback: "Vonkajšiu časť tvoria všetky externé komponenty zapojené do obvodu, pričom dominantný je najmä spotrebič, nie len ochranné prvky." },
            { text: "Súčet elektromotorického a svorkového napätia.", isCorrect: false, feedback: "Napätia sú fyzikálne veličiny (stav obvodu), nie samotné konštrukčné prvky, ktoré tvoria jeho vonkajšiu časť." }
        ]
    },
    {
        question: "Akým spôsobom môžeme v reálnom obvode dosiahnuť, aby sa svorkové napätie zdroja priblížilo k hodnote jeho elektromotorického napätia?",
        options: [
            { text: "Zaradením veľmi veľkého odporu do obvodu, čím sa minimalizuje odoberaný prúd.", isCorrect: true, feedback: "" },
            { text: "Prepojením pólov batérie priamo vodivým drôtom (skrat).", isCorrect: false, feedback: "Toto je definícia skratu. Pri skrate tečie maximálny prúd a svorkové napätie naopak rapídne klesá." },
            { text: "Zvýšením úbytku napätia vo vnútri zdroja.", isCorrect: false, feedback: "Ak sa zvýši úbytok napätia na zdroji ($U_i$), svorkové napätie ($U = U_e - U_i$) sa naopak ešte viac zníži." },
            { text: "Znížením vonkajšieho odporu blízko k nule.", isCorrect: false, feedback: "Zníženie vonkajšieho odporu vedie k nárastu prúdu a väčšiemu úbytku napätia, čím sa svorkové napätie vzďaľuje od $U_e$." }
        ]
    },
    {
        question: "Ako vypočítame hodnotu najväčšieho možného prúdu ($I_{max}$) pri stave, ktorý nazývame spojenie nakrátko?",
        options: [
            { text: "Ako podiel elektromotorického napätia a vnútorného odporu zdroja ($I_{max} = U_e / R_i$).", isCorrect: true, feedback: "" },
            { text: "Ako podiel svorkového napätia a vonkajšieho odporu obvodu ($I_{max} = U / R$).", isCorrect: false, feedback: "Pri skrate je vonkajší odpor $R = 0$, takže s ním vo vzorci už nemôžeme počítať takýmto delením." },
            { text: "Ako súčin úbytku napätia a vnútorného odporu ($I_{max} = U_i \\cdot R_i$).", isCorrect: false, feedback: "Prúd je daný podielom (Ohmov zákon), nie súčinom týchto veličín." },
            { text: "Ako rozdiel elektromotorického napätia a vnútorného odporu zdroja.", isCorrect: false, feedback: "Matematicky nemôžete odčítať napätie (Volty) a odpor (Ohmy) a dostať prúd (Ampéry)." }
        ]
    },
    {
        question: "V kontexte praktického laboratórneho merania: Akú hodnotu odmeriame voltmetrom pripojeným paralelne k zdroju, ak je spínač v obvode rozopnutý?",
        options: [
            { text: "Nameriame hodnotu elektromotorického napätia zdroja ($U_e$).", isCorrect: true, feedback: "" },
            { text: "Nameriame presne $0\\ V$, pretože obvodom netečie prúd.", isCorrect: false, feedback: "Keď obvodom netečie prúd, voltmeter stále ukazuje potenciálový rozdiel na zdroji (tzv. napätie naprázdno)." },
            { text: "Nameriame hodnotu úbytku napätia na vnútornom odpore zdroja.", isCorrect: false, feedback: "Keď je prúd nulový, úbytok napätia na vnútornom odpore ($R_i \\cdot 0$) je tiež nula. Meriame preto samotné $U_e$." },
            { text: "Nameriame minimálne možné svorkové napätie po zaťažení reostatom.", isCorrect: false, feedback: "Pri rozopnutom spínači nie je zdroj vôbec zaťažený, preto nemeriame svorkové napätie zaťaženého obvodu." }
        ]
    },
    {
        question: "Ako môžeme podľa textu fyzicky spôsobiť skratovanie batérie (spojenie nakrátko)?",
        options: [
            { text: "Prepojením pólov batérie priamo vodivým drôtom bez spotrebiča.", isCorrect: true, feedback: "" },
            { text: "Postupným znižovaním elektromotorického napätia vo vnútri batérie.", isCorrect: false, feedback: "Elektromotorické napätie je dané konštrukciou batérie, skrat je spôsobený vonkajším zásahom znižujúcim odpor $R$." },
            { text: "Paralelným pripojením viacerých voltmetrov k zdroju napätia.", isCorrect: false, feedback: "Voltmeter má veľmi veľký vnútorný odpor, takže jeho pripojením nevytvoríte skrat (teda nulový vonkajší odpor)." },
            { text: "Zaradením veľkého ochranného odporu (reostatu) do obvodu.", isCorrect: false, feedback: "Práve naopak. Skrat nastáva, keď sa vonkajší odpor (ako napríklad reostat) vyradí alebo obíde." }
        ]
    },
    {
        question: "Ktorý z nasledujúcich matematických vzťahov správne definuje celkové rozloženie napätí v uzavretom obvode?",
        options: [
            { text: "$U_e = U + U_i$", isCorrect: true, feedback: "" },
            { text: "$U_e = U - U_i$", isCorrect: false, feedback: "Elektromotorické napätie je súčtom napätí na vonkajšej a vnútornej časti, nepočíta sa ako ich rozdiel." },
            { text: "$U_e = R_i + I$", isCorrect: false, feedback: "Tento vzorec je nesprávny, sčíta odpor a prúd, čo sú veličiny rôznych jednotiek." },
            { text: "$U = U_e + R_i \\cdot I$", isCorrect: false, feedback: "Svorkové napätie $U$ je vždy menšie ako $U_e$, preto sa musí od $U_e$ úbytok napätia odčítať, nie pričítať." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT (V8) =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        setTimeout(function() { advanceToNext(); }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) { btn.classList.add('visible'); btn.focus(); }
}

function advanceToNext() {
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) {
            closeModal();
        }
    }
});

document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
});

initQuiz();
</script>
</body>
</html>
