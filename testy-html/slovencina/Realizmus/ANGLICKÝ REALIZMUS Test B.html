<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívny Test</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center; color: #fff; margin-bottom: 8px;
            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }
        .progress-wrapper {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px; transition: width 0.4s ease; width: 0%;
        }
        .question-card {
            background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .question-card.active { display: block; }
        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.95em; line-height: 1.4; color: #333;
        }
        .option-item:hover { border-color: #667eea; background: #f0f0ff; }
        .option-item.correct {
            border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 600;
        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 28px; font-size: 1em; border-radius: 25px;
            cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
            float: right; pointer-events: auto;
        }
        .next-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .next-btn.visible { display: inline-block; }
        .results-card {
            background: #fff; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .results-card h2 { font-size: 1.6em; margin-bottom: 10px; color: #333; }
        .results-score { font-size: 2.8em; font-weight: 700; margin: 20px 0; }
        .results-score.excellent { color: #4caf50; }
        .results-score.good { color: #ff9800; }
        .results-score.poor { color: #f44336; }
        .results-message { font-size: 1.05em; margin-bottom: 30px; color: #555; }
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 14px 40px; font-size: 1.05em; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { color: #f44336; margin-bottom: 12px; font-size: 1.2em; }
        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ANGLICKÝ REALIZMUS</h1>
        <div class="subtitle">Test B</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="quizContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Výsledky testu</h2>
            <div class="results-score" id="resultsScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="restart-btn" id="restartBtn">Skúsiť znova</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>Nesprávna odpoveď</h3>
            <p id="modalText"></p>
            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>
        </div>
    </div>

<script>
const questionsData = [
    {
        question: "Aké povolanie získala Jana Eyrová po tom, čo prežila ťažké obdobie v internátnej škole?",
        options: [
            { text: "Stala sa učiteľkou a neskôr súkromnou vychovávateľkou v rodine pána Rochestera.", isCorrect: true, feedback: "" },
            { text: "Vyučila sa u hrobára, aby unikla chudobe a hladu v internátnej škole.", isCorrect: false, feedback: "Práca u hrobára je spojená s detstvom Olivera Twista v Dickensovom románe, Jana Eyrová sa stala vychovávateľkou." },
            { text: "Začala písať kroniku na cestách po Veľkej Británii po boku svojho oddaného sluhu.", isCorrect: false, feedback: "Písanie kroniky a cestovanie je dejom Dickensovej Kroniky Pickwickovho klubu." },
            { text: "Stala sa vedúcou ústavu pre duševne choré ženy na panstve pána Rochestera.", isCorrect: false, feedback: "Jana sa starala o Rochesterovu dcéru ako vychovávateľka, jeho chorá žena bola pred ňou dlho zatajená." }
        ]
    },
    {
        question: "Aký tragický osud postihol pána Rochestera počas požiaru v jeho sídle?",
        options: [
            { text: "Oslepol a jeho duševne chorá manželka pri požiari zomrela.", isCorrect: true, feedback: "" },
            { text: "Zomrel v plameňoch spolu so svojou manželkou, čím Jana Eyrová získala jeho rozsiahly majetok.", isCorrect: false, feedback: "Pán Rochester požiar prežil, hoci oslepol, a neskôr sa s Janou opäť stretol a zosobášili sa." },
            { text: "Podarilo sa mu manželku zachrániť, vďaka čomu sa nečakane vyliečila z duševnej choroby.", isCorrect: false, feedback: "Jeho manželka pri požiari zahynula a žiadne zázračné vyliečenie z choroby sa nekonalo." },
            { text: "Prišiel o zrak, ale Jana ho kvôli tomu definitívne opustila a odmietla sa k nemu vrátiť.", isCorrect: false, feedback: "Jana ho neopustila pre slepotu, práve naopak, vrátila sa k nemu, mali svadbu a jeho zrak sa dokonca začal zlepšovať." }
        ]
    },
    {
        question: "Aký reálny spoločenský dopad mali literárne diela Charlesa Dickensa vo Veľkej Británii?",
        options: [
            { text: "Prispeli k zásadným zmenám zákonov, vrátane zrušenia väzníc pre dlžníkov a verejných popráv.", isCorrect: true, feedback: "" },
            { text: "Spôsobili, že aristokracia musela odovzdať časť majetku na budovanie internátnych škôl pre dievčatá.", isCorrect: false, feedback: "Toto tvrdenie je vymyslené; Dickens dosiahol zrušenie dlžníckych väzníc, verejných popráv a prispel k reforme školstva." },
            { text: "Viedli k okamžitému zrušeniu fyzických trestov vo všetkých súkromných domácnostiach v Británii.", isCorrect: false, feedback: "Dickens síce kritizoval fyzické tresty v školskom prostredí (Nicholas Nickleby), ale nezmenil zákony pre súkromné domácnosti plošne." },
            { text: "Iniciovali vznik nových zlodejských gángov, ktoré sa inšpirovali jeho presnými opismi z prostredia Londýna.", isCorrect: false, feedback: "Jeho diela mali pozitívny sociálny dopad zameraný na ochranu a pomoc chudobným a deťom, nepodnecovali kriminalitu." }
        ]
    },
    {
        question: "Za aký závažný čin bol uväznený pán Pickwick v Kronike Pickwickovho klubu?",
        options: [
            { text: "Počas svojich ciest bol nespravodlivo obvinený z toho, že je špión.", isCorrect: true, feedback: "" },
            { text: "Bol pristihnutý pri sprenevere peňazí, ktoré predtým vybral od členov svojho klubu na charitu.", isCorrect: false, feedback: "Pán Pickwick bol podľa textu dobrosrdečný a naivný rojko, nie podvodník so spreneverou." },
            { text: "Odsúdili ho za organizovanie verejných popráv, proti ktorým inak verejne vystupoval.", isCorrect: false, feedback: "Zrušenie verejných popráv sa spomína v súvislosti s reálnym dopadom Dickensových diel, nie v deji tohto románu." },
            { text: "Dostal sa do väzenia pre dlžníkov, pretože všetky svoje peniaze neuvážene rozdal chudobným sirotám.", isCorrect: false, feedback: "Znie to ušľachtilo, ale podľa textu sa do väzenia dostal na základe obvinenia zo špionáže." }
        ]
    },
    {
        question: "Kto napokon pomohol Oliverovi Twistovi dostať sa z nebezpečnej zlodejskej bandy v Londýne?",
        options: [
            { text: "Pomohla mu odtiaľ ujsť londýnska prostitútka.", isCorrect: true, feedback: "" },
            { text: "Pomohol mu samotný hrobár, u ktorého predtým pracoval a ktorý oľutoval svoje drsné správanie.", isCorrect: false, feedback: "Od hrobára Oliver ušiel, ten mu už s útekom z londýnskej bandy nepomáhal." },
            { text: "Zachránil ho pán Pickwick, ktorý práve prechádzal Londýnom a zbieral materiál pre svoju kroniku.", isCorrect: false, feedback: "Pán Pickwick je hrdina z iného Dickensovho románu, postavy sa takto dejovo nekrížia." },
            { text: "Zo zlodejskej bandy ho prekvapivo vykúpil jeho stratený otec, s ktorým sa tam náhodou stretol.", isCorrect: false, feedback: "O svojom otcovi sa Oliver dozvie až neskôr na konci príbehu, s útekom mu reálne pomohla prostitútka." }
        ]
    },
    {
        question: "Čo sa stalo s hlavnou postavou, pánom Scroogeom, v závere novely Vianočná koleda?",
        options: [
            { text: "Zažil morálnu katarziu, polepšil sa, rozdal peniaze zamestnancom a strávil Vianoce s rodinou.", isCorrect: true, feedback: "" },
            { text: "Duchovia ho priviedli do takého šialenstva, že sa natrvalo zamkol vo svojej izbe a zomrel v osamelosti.", isCorrect: false, feedback: "Smrť v osamelosti bola len hrozivou víziou budúcnosti, ktorá ho našťastie donútila zmeniť sa a polepšiť." },
            { text: "Po návšteve duchov svoje správanie vôbec nezmenil a vyhlásil, že v živote je dôležitý len nahromadený majetok.", isCorrect: false, feedback: "Naopak, Scrooge prešiel hlbokou katarziou a pochopil, že človek nie je zbytočný, keď aspoň trochu pomôže iným." },
            { text: "Obdaroval chudobných, no napokon musel utiecť z Londýna pred nespokojnými dlžníkmi, ktorých predtým zruinoval.", isCorrect: false, feedback: "Príbeh má vyslovene šťastný koniec a končí pokojnými Vianocami strávenými v kruhu rodiny." }
        ]
    },
    {
        question: "Ktoré z nasledujúcich diel od Oscara Wildea zaraďujeme medzi jeho sentimentálne poviedky?",
        options: [
            { text: "Šťastný princ a Slávik a ruža.", isCorrect: true, feedback: "" },
            { text: "Ideálny manžel a Salome.", isCorrect: false, feedback: "Tieto literárne diela Oscara Wildea sú zaradené medzi jeho známe komédie, nie sentimentálne poviedky." },
            { text: "Vianočná koleda a Oliver Twist.", isCorrect: false, feedback: "Toto nie sú poviedky od Oscara Wildea, ale slávne diela anglického realistu Charlesa Dickensa." },
            { text: "Portrét Doriana Graya a Búrlivé výšiny.", isCorrect: false, feedback: "Portrét Doriana Graya je Wildeov román a Búrlivé výšiny napísala Emily Brontëová." }
        ]
    },
    {
        question: "Ako skončil život Doriana Graya v závere rovnomenného románu?",
        options: [
            { text: "Zničil svoj portrét, čím zabil sám seba; ráno našli obraz opäť krásny a Doriana ako škaredého starca.", isCorrect: true, feedback: "" },
            { text: "Maliar ho nakoniec zo žiarlivosti zavraždil, na čo magický obraz ihneď zhorel na popol.", isCorrect: false, feedback: "V skutočnosti zabil maliara samotný Dorian, nie naopak." },
            { text: "Pokúsil sa obraz predať, no uvedomil si, že sa od neho nevie odpútať, a tak spáchal samovraždu skokom do rieky.", isCorrect: false, feedback: "Dorian nezomrel v rieke, zomrel bezprostredne pri obraze v momente, keď sa ho v záchvate šialenstva rozhodol zničiť." },
            { text: "Keď obraz zničil, kliatba sa zlomila, Dorian opäť získal pokojný život a dožil sa vysokého veku v ústraní.", isCorrect: false, feedback: "Zničením obrazu Dorian zomrel a premenil sa na škaredého a starého človeka, zatiaľ čo obraz zázračne opeknel." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT (V8) =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        // Correct answer: auto-advance after 1.5s
        setTimeout(function() {
            advanceToNext();
        }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        // Highlight the correct answer in green
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        // Wrong answer: NO auto-advance! Show modal, then manual "Next" button.
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            // No feedback text — show next button immediately
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) {
        btn.classList.add('visible');
        btn.focus();
    }
}

function advanceToNext() {
    // Guard: do not advance while waiting for user to review correct answer
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    // After closing modal, show the "Next question" button so user can review the correct answer
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) {
            closeModal();
        }
    }
});

document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
});

initQuiz();
</script>
</body>
</html>
