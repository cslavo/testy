<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívny Test</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center; color: #fff; margin-bottom: 8px;
            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }
        .progress-wrapper {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px; transition: width 0.4s ease; width: 0%;
        }
        .question-card {
            background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .question-card.active { display: block; }
        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.95em; line-height: 1.4; color: #333;
        }
        .option-item:hover { border-color: #667eea; background: #f0f0ff; }
        .option-item.correct {
            border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 600;
        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 28px; font-size: 1em; border-radius: 25px;
            cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
            float: right; pointer-events: auto;
        }
        .next-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .next-btn.visible { display: inline-block; }
        .results-card {
            background: #fff; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .results-card h2 { font-size: 1.6em; margin-bottom: 10px; color: #333; }
        .results-score { font-size: 2.8em; font-weight: 700; margin: 20px 0; }
        .results-score.excellent { color: #4caf50; }
        .results-score.good { color: #ff9800; }
        .results-score.poor { color: #f44336; }
        .results-message { font-size: 1.05em; margin-bottom: 30px; color: #555; }
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 14px 40px; font-size: 1.05em; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { color: #f44336; margin-bottom: 12px; font-size: 1.2em; }
        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ANGLICKÝ REALIZMUS</h1>
        <div class="subtitle">Test A</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="quizContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Výsledky testu</h2>
            <div class="results-score" id="resultsScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="restart-btn" id="restartBtn">Skúsiť znova</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>Nesprávna odpoveď</h3>
            <p id="modalText"></p>
            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>
        </div>
    </div>

<script>
const questionsData = [
    {
        question: "Kto je hlavným hrdinom v dielach Charlotte Brontëovej?",
        options: [
            { text: "Dievčatá a ženy, pričom diela nesú často autobiografické črty.", isCorrect: true, feedback: "" },
            { text: "Chlapci a mladí muži z prostredia chudobných londýnskych štvrtí.", isCorrect: false, feedback: "Toto je typické zameranie pre Charlesa Dickensa, nie pre Charlotte Brontëovú." },
            { text: "Zosnulé historické osobnosti anglických dejín z obdobia renesancie.", isCorrect: false, feedback: "Jej romány boli sociálne a vychádzali z jej vlastných skúseností, nepísala primárne historické romány o zosnulých." },
            { text: "Výlučne staršie, bohaté aristokratky s tragickým osudom.", isCorrect: false, feedback: "Hrdinkami boli často mladé dievčatá, napríklad siroty bojujúce s chudobou, akou bola Jana Eyrová." }
        ]
    },
    {
        question: "Aké tajomstvo skrýval pán Rochester v románe Jana Eyrová?",
        options: [
            { text: "V dome držal pod zámkom svoju duševne chorú manželku.", isCorrect: true, feedback: "" },
            { text: "Bol tajným vodcom zlodejskej bandy pôsobiacej v Londýne.", isCorrect: false, feedback: "Zlodejská banda sa objavuje v Dickensovom románe Oliver Twist, nie v Jane Eyrovej." },
            { text: "Bol zodpovedný za úmyselné podpálenie internátnej školy, kde Jana študovala.", isCorrect: false, feedback: "Požiar sa v knihe odohrá, ale založí ho jeho chorá manželka na panstve, nie v internátnej škole." },
            { text: "Vydával sa za bohatého šľachtica, no v skutočnosti bol hľadaným špiónom.", isCorrect: false, feedback: "Z obvinenia zo špionáže bol nespravodlivo podozrievaný pán Pickwick u Charlesa Dickensa." }
        ]
    },
    {
        question: "Aké hlavné idey a posolstvo nesie román Búrlivé výšiny od Emily Brontëovej?",
        options: [
            { text: "Nenávisť a pomsta neprinesú šťastie, no nakoniec predsa len zvíťazí láska a odpustenie.", isCorrect: true, feedback: "" },
            { text: "Spoločnosť je nenapraviteľná a osud chudobných sirôt je vopred spečatený tragédiou.", isCorrect: false, feedback: "Román nakoniec speje k odpusteniu a láske, nehlása absolútny fatalizmus a beznádej pre chudobných." },
            { text: "Láska a odpustenie sú len ilúziou, hlavný hrdina napokon umiera v úplnej osamelosti a šialenstve.", isCorrect: false, feedback: "Podľa textu nakoniec láska zvíťazí a dochádza k odpusteniu. Šialenstvo a smrť z osamelosti je motívom Portrétu Doriana Graya alebo víziou vo Vianočnej kolede." },
            { text: "Fyzické tresty a ponižovanie v školách deformujú detskú dušu a menia ju na plnú nenávisti.", isCorrect: false, feedback: "Kritika fyzických trestov v školách je ústrednou témou Dickensovho diela Nicholas Nickleby." }
        ]
    },
    {
        question: "Aký literárny žáner predstavuje Dickensova Kronika Pickwickovho klubu a kto je jej hlavným hrdinom?",
        options: [
            { text: "Je to pikareskný román, ktorého hrdinom je dobrosrdečný, no naivný rojko.", isCorrect: true, feedback: "" },
            { text: "Ide o sentimentálnu poviedku o sirote, ktorá sa snaží prežiť v krutom svete.", isCorrect: false, feedback: "Kronika Pickwickovho klubu nie je o sirote, ale o tučnom mládencovi cestujúcom so sluhom. O sirote je Oliver Twist." },
            { text: "Je to hororový román, kde hlavný hrdina bojuje s vlastným temným svedomím.", isCorrect: false, feedback: "K hororovým motívom a boju so svedomím má bližšie Wildeov Portrét Doriana Graya." },
            { text: "Predstavuje autobiografický sociálny román s výraznou kritikou väzníc pre dlžníkov.", isCorrect: false, feedback: "Hoci Dickens kritizoval väznice, tento konkrétny román je definovaný primárne ako vtipný pikareskný román o putovaní." }
        ]
    },
    {
        question: "Kde začínal pracovať Oliver Twist po svojom ťažkom detstve, skôr než ušiel do Londýna?",
        options: [
            { text: "Po živote plnom útrap sa začal učiť u hrobára.", isCorrect: true, feedback: "" },
            { text: "Pracoval ako súkromný vychovávateľ v bohatej londýnskej rodine.", isCorrect: false, feedback: "Súkromnou vychovávateľkou bola Jana Eyrová v diele Charlotte Brontëovej, nie malý Oliver Twist." },
            { text: "Pomáhal v sirotinci ako asistent mimoriadne prísneho učiteľa.", isCorrect: false, feedback: "Oliver zo sirotinca ušiel do učenia k hrobárovi, nepracoval tam ako asistent učiteľa." },
            { text: "Hneď po narodení bol predaný priamo do nebezpečnej londýnskej zlodejskej bandy.", isCorrect: false, feedback: "Do zlodejskej bandy sa dostal až neskôr, po úteku od hrobára priamo do Londýna." }
        ]
    },
    {
        question: "Aké prostredie a problematiku najvýraznejšie kritizuje Charles Dickens v diele Nicholas Nickleby?",
        options: [
            { text: "Podmienky v školskom prostredí a kruté fyzické tresty na deťoch.", isCorrect: true, feedback: "" },
            { text: "Nespravodlivosť verejných popráv a existenciu väzníc pre dlžníkov.", isCorrect: false, feedback: "Tieto reformy Dickens síce svojou prácou dosiahol, ale konkrétne dielo Nicholas Nickleby sa zameriava primárne na školstvo." },
            { text: "Povrchnosť, aroganciu a samoľúbosť vtedajšej anglickej vysokej aristokracie.", isCorrect: false, feedback: "Povrchnosť a samoľúbosť sú skôr hlavnými témami Wildeovho spoločenského románu Portrét Doriana Graya." },
            { text: "Zlé zaobchádzanie so ženami v internátnych školách a ich verejné ponižovanie.", isCorrect: false, feedback: "Ponižovanie žien a dievčat v internátnej škole je ústredným motívom románu Jana Eyrová od Charlotte Brontëovej." }
        ]
    },
    {
        question: "Aké dva literárne smery sa výrazne prelínajú v tvorbe írskeho autora Oscara Wildea?",
        options: [
            { text: "Realizmus a romantizmus.", isCorrect: true, feedback: "" },
            { text: "Je to výlučne realistický autor, ktorý ostro odmietal akékoľvek romantické ideály.", isCorrect: false, feedback: "Wilde ako autor prelína oba smery, jeho diela obsahujú aj silné romantické, ba až hororové a dekadentné prvky." },
            { text: "Považuje sa výhradne za zakladateľa pikareskného románu vo Veľkej Británii.", isCorrect: false, feedback: "Pikareskný román (putovanie hrdinu) v tomto učive reprezentuje Charles Dickens a jeho Kronika Pickwickovho klubu." },
            { text: "Spájal vo svojich dielach prvky prísneho klasicizmu a osvietenského racionalizmu.", isCorrect: false, feedback: "Text jasne uvádza, že v prípade Oscara Wildea išlo o literárne spojenie realizmu a romantizmu." }
        ]
    },
    {
        question: "Akým spôsobom sa menil Portrét Doriana Graya po tom, čo sa Dorianovo želanie splnilo?",
        options: [
            { text: "Obraz starnul a odzrkadľovali sa na ňom Dorianove hriechy, zatiaľ čo on zostával mladý a krásny.", isCorrect: true, feedback: "" },
            { text: "Obraz zostával navždy krásny a dokonalý, no samotný Dorian pod ťarchou hriechov rýchlo fyzicky chátral.", isCorrect: false, feedback: "Bolo to presne naopak - Dorian si prial zostať večne pekný a jeho želanie sa splnilo na úkor jeho magického portrétu." },
            { text: "Obraz zakaždým vzplanul slabým plameňom, keď Dorian spáchal nejaký nemravný skutok.", isCorrect: false, feedback: "Obraz nehorel (hoci u Brontëovej je motív požiaru). Len sa menil a špatnel pod ťarchou jeho činov a veku." },
            { text: "Portrét síce starnul, no zároveň dokázal s Dorianom komunikovať a radiť mu v klamstvách.", isCorrect: false, feedback: "Obraz nebol hovoriaci magický radca; len nemým spôsobom vizuálne odrážal jeho morálny úpadok." }
        ]
    },
    {
        question: "Ktoré z menovaných diel reprezentujú komédie Oscara Wildea, plné slovného humoru, irónie a kalambúrov?",
        options: [
            { text: "Ideálny manžel, Ako je dôležité mať Filipa, Salome.", isCorrect: true, feedback: "" },
            { text: "Šťastný princ, Slávik a ruža, Vianočná koleda.", isCorrect: false, feedback: "Šťastný princ a Slávik a ruža sú sentimentálne poviedky a Vianočná koleda je od Dickensa." },
            { text: "Nicholas Nickleby, Oliver Twist, Kronika Pickwickovho klubu.", isCorrect: false, feedback: "Tieto diela sú známe sociálne a pikareskné romány, ktorých autorom je Charles Dickens." },
            { text: "Búrlivé výšiny, Jana Eyrová, Salome.", isCorrect: false, feedback: "Búrlivé výšiny a Jana Eyrová sú vážne romány anglického realizmu, ktoré napísali sestry Brontëové." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT (V8) =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        // Correct answer: auto-advance after 1.5s
        setTimeout(function() {
            advanceToNext();
        }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        // Highlight the correct answer in green
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        // Wrong answer: NO auto-advance! Show modal, then manual "Next" button.
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            // No feedback text — show next button immediately
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) {
        btn.classList.add('visible');
        btn.focus();
    }
}

function advanceToNext() {
    // Guard: do not advance while waiting for user to review correct answer
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    // After closing modal, show the "Next question" button so user can review the correct answer
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) {
            closeModal();
        }
    }
});

document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
});

initQuiz();
</script>
</body>
</html>
