<script>
const questionsData = [
    {
        question: "Ako skončil život dramatika a prozaika Nikolaja Vasiľjeviča Gogoľa?",
        options: [
            { text: "Zomrel v šialenstve a ťažkej depresii.", isCorrect: true, feedback: "" },
            { text: "Bol odsúdený a zomrel vo vyhnanstve na Sibíri.", isCorrect: false, feedback: "Gogoľ nebol poslaný na Sibír (to bol osud mnohých Dostojevského postáv). Zomrel psychicky chorý." },
            { text: "Spáchal samovraždu skokom pod vlak.", isCorrect: false, feedback: "Toto je osud Anny Kareninovej, fiktívnej postavy z Tolstého románu, nie reálneho autora Gogoľa." },
            { text: "Prežil pokojnú starosť vo Švajčiarsku, kde sa liečil z epilepsie.", isCorrect: false, feedback: "Liečenie vo Švajčiarsku z epilepsie je charakteristické pre Dostojevského postavu kniežaťa Myškina (Idiot)." }
        ]
    },
    {
        question: "S akým cieľom kupoval Čičikov nevoľníkov v románe Mŕtve duše?",
        options: [
            { text: "Plánoval na mŕtve duše získať vládnu pôžičku a následne ujsť za hranice.", isCorrect: true, feedback: "" },

        ]
    },
    {

            { text: "\"Neobviňuj zrkadlo, ak ti namiesto tváre ukáže rypák.\"", isCorrect: true, feedback: "" },
            { text: "\"Keď niet Boha, je dovolené všetko.\"", isCorrect: false, feedback: "Toto je slávna myšlienka Ivana Karamazova z Dostojevského románu Bratia Karamazovovci." },

        ]
    },
    {
        question: "Aký bol literárny a spoločenský cieľ I. S. Turgeneva, zmieňovaný v súvislosti s jeho dielom?",

            { text: "Kritizoval nevoľnícky systém v Rusku a hľadal silu, ktorá by mohla krajinu zachrániť.", isCorrect: true, feedback: "" },
            { text: "Snažil sa dokázať, že ruský štát môžu zachrániť iba výnimoční jednotlivci – nadľudia.", isCorrect: false, feedback: "Myšlienka \"výnimočných jednotlivcov\" (nadľudí) vychádza od Nietzscheho a polemizuje s ňou Dostojevskij v Zločine a treste, nie Turgenev." },

            { text: "Zameriaval sa na obhajobu cárskej byrokracie a vysmieval sa chudobnému úradníctvu.", isCorrect: false, feedback: "Turgenev cársky systém (najmä nevoľníctvo) kritizoval, neobhajoval ho. Výsmech z úradníctva strácajúceho hrdosť je skôr doménou Čechova." }
        ]
    },
    {
        question: "Čo v Dostojevského tvorbe znamená pojem \"antropocentrizmus\"?",
        options: [
            { text: "Znamená to, že v centre autorovej pozornosti je človek, ktorý je chápaný ako nevyriešená \"hádanka\".", isCorrect: true, feedback: "" },

            { text: "Ide o autorský postoj, kedy rozprávač vystupuje ako Boh, ktorý hodnotí všetky postavy.", isCorrect: false, feedback: "Antropocentrizmus neznamená božský pohľad, ale doslova to, že centrom všetkého diania a záujmu je samotný človek (anthropos)." }
        ]
    },
    {
        question: "Prečo sa hlavný hrdina Dostojevského románu volá \"Idiot\"?",

            { text: "Pretože zavraždil starú úžerníčku bez toho, aby si premyslel následky svojho konania.", isCorrect: false, feedback: "Vražda úžerníčky je námetom románu Zločin a trest (Raskolnikov), nie románu Idiot." },
            { text: "Pretože odmietal uveriť v Boha a neustále opakoval, že všetko je dovolené.", isCorrect: false, feedback: "Tento postoj je charakteristický pre nihilistu Ivana z Bratov Karamazovovcov, kým Myškin má naopak silné kresťanské a mravné hodnoty." }

    {

        ]
    },
    {

            { text: "Prijal tento trest ako formu vnútornej katarzie (očisty).", isCorrect: true, feedback: "" },
            { text: "Odmietol trest a s pomocou brata Aľošu ušiel za hranice do Talianska.", isCorrect: false, feedback: "Dimitrij trest prijal a na Sibír s ním odišla aj Grušenka. Do Talianska odišiel autor Gogoľ po premiére Revízora." },
            { text: "Zrútil sa, zbláznil a spáchal pred odchodom na Sibír samovraždu.", isCorrect: false, feedback: "Samovraždu spáchal skutočný vrah Pavel, ktorému súd neveril. Dimitrij trest zobral na seba ako očistu." },
            { text: "Preklial svojich bratov a vyhlásil, že ľudia by odsúdili Krista aj druhýkrát.", isCorrect: false, feedback: "Odsúdenie Krista druhýkrát je hlboká filozofická myšlienka prítomná v románe (Legenda o Veľkom inkvizítorovi od Ivana), ale nie je to Dimitrijova reakcia na rozsudok." }

    {

            { text: "Požičala mu peniaze zarobené prostitúciou, aby mohol dokončiť štúdium a utajiť vraždu.", isCorrect: false, feedback: "Jej rola nebola finančná (peniaze potrebovala pre svojich súrodencov), ale morálna a duchovná záchrana Raskolnikova." },

    {

// ===== UNIVERSAL SCRIPT (V8) =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        setTimeout(function() {
            advanceToNext();
        }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) {
        btn.classList.add('visible');
        btn.focus();
    }
}

function advanceToNext() {
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) {
            closeModal();
        }
    }
});

document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
});

initQuiz();
</script>
