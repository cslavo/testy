<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívny Test - Test A</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center; color: #fff; margin-bottom: 8px;
            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }
        .progress-wrapper {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px; transition: width 0.4s ease; width: 0%;
        }
        .question-card {
            background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .question-card.active { display: block; }
        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.95em; line-height: 1.4; color: #333;
        }
        .option-item:hover { border-color: #667eea; background: #f0f0ff; }
        .option-item.correct {
            border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 600;
        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 28px; font-size: 1em; border-radius: 25px;
            cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
            float: right; pointer-events: auto;
        }
        .next-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .next-btn.visible { display: inline-block; }
        .results-card {
            background: #fff; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .results-card h2 { font-size: 1.6em; margin-bottom: 10px; color: #333; }
        .results-score { font-size: 2.8em; font-weight: 700; margin: 20px 0; }
        .results-score.excellent { color: #4caf50; }
        .results-score.good { color: #ff9800; }
        .results-score.poor { color: #f44336; }
        .results-message { font-size: 1.05em; margin-bottom: 30px; color: #555; }
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 14px 40px; font-size: 1.05em; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { color: #f44336; margin-bottom: 12px; font-size: 1.2em; }
        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>REALIZMUS (2. pol. 19. stor.)</h1>
        <div class="subtitle">Test A</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="quizContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Výsledky testu</h2>
            <div class="results-score" id="resultsScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="restart-btn" id="restartBtn">Skúsiť znova</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>Nesprávna odpoveď</h3>
            <p id="modalText"></p>
            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>
        </div>
    </div>

<script>
const questionsData = [
    {
        question: "Aké sú historické a literárne okolnosti vzniku realizmu?",
        options: [
            { text: "Vznikol v druhej polovici 19. storočia ako reakcia na romantizmus.", isCorrect: true, feedback: "" },
            { text: "Vznikol ako plynulé pokračovanie romantizmu, z ktorého prebral dôraz na výnimočného hrdinu.", isCorrect: false, feedback: "Realizmus na romantizmus nenadväzoval plynule, ale vznikol ako reakcia naň a výnimočného hrdinu nahradil bežným človekom." },
            { text: "Formoval sa v prvej polovici 19. storočia ako odpoveď na rozvoj kapitalizmu.", isCorrect: false, feedback: "Realizmus sa formoval až v druhej polovici 19. storočia, nie v prvej." },
            { text: "Vznikol ako reakcia na pozitivizmus, pričom odmietal vedecké overovanie skutočnosti.", isCorrect: false, feedback: "Realizmus z pozitivizmu vychádzal a inšpiroval sa ním, neodmietal ho." }
        ]
    },
    {
        question: "Ako definuje filozofia pozitivizmu to, čo je \"skutočné\"?",
        options: [
            { text: "Za skutočné považuje len to, čo sa dá vedecky overiť, napríklad experimentom.", isCorrect: true, feedback: "" },
            { text: "Za skutočné považuje len to, čo človek prežíva vo svojom vnútornom, subjektívnom svete.", isCorrect: false, feedback: "Toto je znakom romantizmu. Pozitivizmus vyžaduje objektívne, vedecké overenie." },
            { text: "Tvrdí, že skutočnosť je nezávislá od prostredia a dá sa overiť len historickými udalosťami.", isCorrect: false, feedback: "Pozitivizmus sa opiera o vedu a experimenty v prítomnosti, nie primárne o historické udalosti." },
            { text: "Zameriava sa výlučne na kritiku kapitalizmu a odmieta akékoľvek vedecké objavy.", isCorrect: false, feedback: "Pozitivizmus je filozofický smer založený práve na dôvere vo vedecké overovanie a experimenty." }
        ]
    },
    {
        question: "Čo v kontexte znakov realizmu znamená pojem \"typizácia\"?",
        options: [
            { text: "Zovšeobecnenie vlastností, ktoré sú typické pre určitú spoločenskú skupinu alebo triedu.", isCorrect: true, feedback: "" },
            { text: "Zameranie sa na jedinečné a neopakovateľné vlastnosti výnimočného hrdinu.", isCorrect: false, feedback: "Toto je znak romantizmu. Realizmus hľadá spoločné, typické znaky celej skupiny." },
            { text: "Vytváranie ideálnych typov postáv, ktoré unikajú pred bežným všedným životom.", isCorrect: false, feedback: "Realizmus postavy neidealizuje a neuniká pred realitou, ale zobrazuje ju takú, aká je." },
            { text: "Presné kopírovanie historických postáv z minulosti do súčasnej literatúry.", isCorrect: false, feedback: "Typizácia sa týka zovšeobecňovania vlastností spoločenských tried v súčasnosti, nie kopírovania histórie." }
        ]
    },
    {
        question: "Aké témy z bežného všedného života sú typické pre realistické diela?",
        options: [
            { text: "Peniaze, honba za majetkom, karierizmus a kritika spoločenských nedostatkov.", isCorrect: true, feedback: "" },
            { text: "Neobvyklé situácie, únik do prírody a hľadanie stratených historických ideálov.", isCorrect: false, feedback: "Tieto témy sú príznačné pre romantizmus, realizmus sa venuje bežnému, všednému životu." },
            { text: "Oslava kapitalizmu ako dokonalého systému bez majetkových rozdielov.", isCorrect: false, feedback: "Realizmus naopak kapitalizmus a veľké majetkové rozdiely tvrdo kritizuje." },
            { text: "Výlučne vedecké experimenty a filozofické úvahy bez zobrazenia medziľudských vzťahov.", isCorrect: false, feedback: "Hoci realizmus ovplyvnila veda, jeho hlavným cieľom je pravdivý obraz medziľudských vzťahov a spoločnosti." }
        ]
    },
    {
        question: "Aký je hlavný rozdiel medzi hrdinom v romantizme a v realizme?",
        options: [
            { text: "Kým romantizmus zobrazuje výnimočného hrdinu, realizmus sa zameriava na bežného, všedného človeka.", isCorrect: true, feedback: "" },
            { text: "Romantizmus aj realizmus sa zhodne zameriavajú na výnimočného hrdinu, no realizmus ho umiestňuje do súčasnosti.", isCorrect: false, feedback: "Realizmus výnimočného hrdinu úplne opúšťa a nahrádza ho obyčajným človekom." },
            { text: "Realizmus uprednostňuje hrdinu z historických udalostí, zatiaľ čo romantizmus hrdinu z bežného dňa.", isCorrect: false, feedback: "Je to presne naopak. Romantizmus často čerpá z histórie, realizmus zo súčasnosti." },
            { text: "V realizme hrdina formuje svoje prostredie, kým v romantizme je hrdina prostredím determinovaný.", isCorrect: false, feedback: "V realizme je charakter človeka ovplyvnený prostredím, v romantizme hrdina často stojí proti nemu." }
        ]
    },
    {
        question: "Aký bol hlavný cieľ realizmu ako literárnej metódy?",
        options: [
            { text: "Podať pravdivý obraz medziľudských vzťahov a spoločenských pomerov.", isCorrect: true, feedback: "" },
            { text: "Subjektívne zhodnotiť historické udalosti a vyzdvihnúť národnú hrdosť.", isCorrect: false, feedback: "Realizmus uprednostňuje objektívne zobrazenie súčasnosti, nie subjektívne hodnotenie histórie." },
            { text: "Vytvoriť nový literárny jazyk založený výlučne na poézii a metaforách.", isCorrect: false, feedback: "Pre realizmus je typická próza, najmä román, nie poézia." },
            { text: "Dokázať Darwinovu teóriu evolúcie prostredníctvom literárnych experimentov.", isCorrect: false, feedback: "Darwinove objavy boli súčasťou doby, ale cieľom literárneho realizmu bolo zobraziť spoločenské pomery, nie dokazovať biologické teórie." }
        ]
    },
    {
        question: "Ako sa v období realizmu prejavoval kapitalizmus v spoločnosti?",
        options: [
            { text: "Predstavoval vládu peňazí, vytváral veľké majetkové rozdiely a túžbu ľudí získať majetok.", isCorrect: true, feedback: "" },
            { text: "Zabezpečil rovnomerné rozdelenie majetku, čo viedlo k harmonickým medziľudským vzťahom.", isCorrect: false, feedback: "Text jasne hovorí, že kapitalizmus priniesol veľké majetkové rozdiely a vládu peňazí." },
            { text: "Spôsobil odklon literatúry od prózy k poézii, keďže autori hľadali únik pred realitou.", isCorrect: false, feedback: "Realizmus na kapitalizmus reagoval kritikou v prozaických dielach, neuchyľoval sa k poézii ako úniku." },
            { text: "Bol hlavným dôvodom, prečo sa autori začali orientovať na historické témy a neobvyklé situácie.", isCorrect: false, feedback: "Tieto znaky patria romantizmu. Realistickí autori sa zamerali na prítomnosť a všedný život ovplyvnený kapitalizmom." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT (V8) =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        setTimeout(function() {
            advanceToNext();
        }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) {
        btn.classList.add('visible');
        btn.focus();
    }
}

function advanceToNext() {
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) {
            closeModal();
        }
    }
});

document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
});

initQuiz();
</script>
</body>
</html>
