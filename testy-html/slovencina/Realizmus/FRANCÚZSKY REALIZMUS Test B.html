<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívny Test</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center; color: #fff; margin-bottom: 8px;
            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }
        .progress-wrapper {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px; transition: width 0.4s ease; width: 0%;
        }
        .question-card {
            background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .question-card.active { display: block; }
        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.95em; line-height: 1.4; color: #333;
        }
        .option-item:hover { border-color: #667eea; background: #f0f0ff; }
        .option-item.correct {
            border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 600;
        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 28px; font-size: 1em; border-radius: 25px;
            cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
            float: right; pointer-events: auto;
        }
        .next-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .next-btn.visible { display: inline-block; }
        .results-card {
            background: #fff; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .results-card h2 { font-size: 1.6em; margin-bottom: 10px; color: #333; }
        .results-score { font-size: 2.8em; font-weight: 700; margin: 20px 0; }
        .results-score.excellent { color: #4caf50; }
        .results-score.good { color: #ff9800; }
        .results-score.poor { color: #f44336; }
        .results-message { font-size: 1.05em; margin-bottom: 30px; color: #555; }
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 14px 40px; font-size: 1.05em; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { color: #f44336; margin-bottom: 12px; font-size: 1.2em; }
        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FRANCÚZSKY REALIZMUS</h1>
        <div class="subtitle">Test B</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="quizContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Výsledky testu</h2>
            <div class="results-score" id="resultsScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="restart-btn" id="restartBtn">Skúsiť znova</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>Nesprávna odpoveď</h3>
            <p id="modalText"></p>
            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>
        </div>
    </div>

<script>
const questionsData = [
    {
        question: "Čo označuje pojem \"Kamenný román\" v súvislosti s tvorbou Honoré de Balzaca?",
        options: [
            { text: "Pojem označujúci tzv. návratné postavy, ktoré v rôznych dielach prechádzajú z hlavnej do vedľajšej roly.", isCorrect: true, feedback: "" },
            { text: "Je to názov jeho prvého, autobiografického románu o ambicióznom spisovateľovi.", isCorrect: false, feedback: "Jeho prvý autobiografický román sa volá Šagrénová koža, pojem kamenný román súvisí s návratnými postavami." },
            { text: "Ide o Stendhalovo literárne dielo, ktoré opisuje despotizmus francúzskej spoločnosti.", isCorrect: false, feedback: "Stendhalovo dielo o spoločnosti je Červený a Čierny, pojem kamenný román patrí do Balzacovej tvorby." },
            { text: "Označenie pre diela Flauberta zamerané na kritiku mravov francúzskeho vidieka.", isCorrect: false, feedback: "Mravy francúzskeho vidieka je podtitul Pani Bovaryovej, nesúvisí to s pojmom kamenný román." }
        ]
    },
    {
        question: "Ktoré dve úmrtia tvoria záver Balzacovho románu Otec Goriot?",
        options: [
            { text: "Fyzická smrť otca Goriota a morálna smrť Eugena de Rastignaca.", isCorrect: true, feedback: "" },
            { text: "Smrť oboch Goriotových dcér, Anastasie a Delphine, v absolútnej chudobe.", isCorrect: false, feedback: "Dcéry žili v bohatstve a nezomreli, dokonca ani neprišli otcovi na pohreb." },
            { text: "Smrť otca Goriota a samovražda Eugena de Rastignaca, ktorý nezvládol tlak spoločnosti.", isCorrect: false, feedback: "Eugen nespáchal samovraždu (o nej uvažoval Rafael v Šagrénovej koži), Eugen podľahol morálnemu úpadku pre peniaze." },
            { text: "Zabitie Goriota pri bitke o dedičstvo a poprava Eugena za jeho vraždu.", isCorrect: false, feedback: "Goriot zomiera v chudobe a samote, nie je zavraždený, a Eugen nie je popravený." }
        ]
    },
    {
        question: "Aké ďalšie romány s témou úpadku morálky a degradácie lásky na peniaze patria Balzacovi?",
        options: [
            { text: "Stratené ilúzie a Lesk a bieda kurtizán.", isCorrect: true, feedback: "" },
            { text: "Červený a Čierny a Pani Bovaryová.", isCorrect: false, feedback: "Tieto diela napísali iní autori: Červený a Čierny Stendhal, a Pani Bovaryovú Gustave Flaubert." },
            { text: "Mravy francúzskeho vidieka a Šagrénová koža.", isCorrect: false, feedback: "Mravy francúzskeho vidieka je len podtitul Flaubertovej knihy, nie samostatný Balzacov román." },
            { text: "Otec Goriot a Denník tesárovho syna.", isCorrect: false, feedback: "Otec Goriot patrí Balzacovi, ale Denník tesárovho syna neexistuje (tesárov syn bol Julien Sorel u Stendhala)." }
        ]
    },
    {
        question: "Akú magickú vlastnosť mala Šagrénová koža zo stejnomenného románu?",
        options: [
            { text: "Splní majiteľovi každé želanie, ale zároveň sa zmenšuje a skracuje mu tým život.", isCorrect: true, feedback: "" },
            { text: "Zabezpečí majiteľovi večný život a mladosť, no vezme mu schopnosť milovať.", isCorrect: false, feedback: "Koža nepriniesla večný život, práve naopak – so zmenšovaním kože sa zmenšoval a krátil aj život jej majiteľa." },
            { text: "Po každom vyslovenom klamstve zmení fyzický vzhľad majiteľa, až ho vyčlení zo spoločnosti.", isCorrect: false, feedback: "Koža menila len svoju veľkosť a dĺžku Rafaelovho života, nereagovala na klamstvá zmenou jeho podoby." },
            { text: "Prinesie človeku bohatstvo, ale po čase prepíše jeho minulosť tak, že zabudne, kým pôvodne bol.", isCorrect: false, feedback: "Rafael si veľmi dobre pamätal, kým je. Strach mu naháňalo to, že koža sa zmenšuje a on sa blíži k smrti." }
        ]
    },
    {
        question: "Aký bol podtitul Flaubertovho románu Pani Bovaryová?",
        options: [
            { text: "Mravy francúzskeho vidieka", isCorrect: true, feedback: "" },
            { text: "Lesk a bieda kurtizán", isCorrect: false, feedback: "Toto je samostatný román od Honoré de Balzaca, nie podtitul Flaubertovho diela." },
            { text: "Kronika francúzskeho despotizmu", isCorrect: false, feedback: "Tento pojem odkazuje skôr na Stendhalovo zobrazenie spoločnosti v Červenom a Čiernom, nie na Pani Bovaryovú." },
            { text: "Ľudská komédia 19. storočia", isCorrect: false, feedback: "Ľudská komédia je súborný názov diel Honoré de Balzaca." }
        ]
    },
    {
        question: "Ako sa skončí život Emy Bovaryovej?",
        options: [
            { text: "Otrávi sa arzénom kvôli obrovským dlhom, ktoré narobila pre svojich milencov.", isCorrect: true, feedback: "" },
            { text: "Zomrie od žiaľu po tom, čo ju jej manžel Karol vyhnal z domu za neveru.", isCorrect: false, feedback: "Karol o jej nevere a dlhoch dlho netušil, naopak, to on umiera od žiaľu po jej smrti." },
            { text: "Je popravená na výstrahu pred ľuďmi po tom, čo postrelila svojho milenca.", isCorrect: false, feedback: "Toto je osud Juliena Sorela v románe Červený a Čierny, nie Emy Bovaryovej." },
            { text: "Dožije v chudobe ako robotníčka, zatiaľ čo jej manžel utečie do Paríža.", isCorrect: false, feedback: "Robotníčka sa stala z jej dcéry po tom, čo Ema spáchala samovraždu a Karol zomrel." }
        ]
    },
    {
        question: "Ktorú historickú osobnosť Henri Beyle Stendhal obdivoval?",
        options: [
            { text: "Napoleona", isCorrect: true, feedback: "" },
            { text: "Otca Goriota", isCorrect: false, feedback: "Otec Goriot je len vymyslená literárna postava z románu Honoré de Balzaca." },
            { text: "Kráľa Ľudovíta", isCorrect: false, feedback: "Stendhal bol nepriateľom aristokracie, panovníkov z radov šľachty neobdivoval." },
            { text: "Eugen de Rastignaca", isCorrect: false, feedback: "Rastignac je opäť len fiktívna postava z Balzacovej tvorby, nie historická osobnosť." }
        ]
    },
    {
        question: "Ako chcel Julien Sorel z románu Červený a Čierny dosiahnuť postup do vyššej spoločnosti?",
        options: [
            { text: "Na radu kňaza išiel študovať teológiu a začal si zarábať vyučovaním latinčiny u starostu.", isCorrect: true, feedback: "" },
            { text: "Začal študovať medicínu na vidieku, aby si získal rešpekt vážených rodín.", isCorrect: false, feedback: "Lekárom z vidieka bol Karol Bovary v diele Flauberta. Julien študoval teológiu." },
            { text: "Odsťahoval sa do Paríža a pokúsil sa presadiť ako autor veľkých spoločenských románov.", isCorrect: false, feedback: "Tento popis sedí na Rafaela de Valentin z románu Šagrénová koža." },
            { text: "Uzavrel obchod so starinárom a vymenil svoj život za okamžité bohatstvo a pozície.", isCorrect: false, feedback: "Toto je zápletka Šagrénovej kože od Balzaca, nie cesta Juliena Sorela." }
        ]
    },
    {
        question: "Kto bola Matilda v Stendhalovom románe Červený a Čierny?",
        options: [
            { text: "Dcéra generála, ktorú Julien spoznal v armáde, a ktorá s ním otehotnela.", isCorrect: true, feedback: "" },
            { text: "Starostova manželka, s ktorou mal Julien úprimný milostný vzťah, kým ich neprezradili.", isCorrect: false, feedback: "Starostova manželka sa volala pani Derenalová, Matilda bola generálova dcéra." },
            { text: "Dcéra otca Goriota, ktorá Juliena využívala len na to, aby sa dostala do parížskej smotánky.", isCorrect: false, feedback: "Goriotove dcéry sa volali Anastasie a Delphine a patrili do Balzacovho románu." },
            { text: "Chudobná robotníčka, ktorá Juliena pochovala po jeho poprave.", isCorrect: false, feedback: "Matilda nebola robotníčka, ale aristokratka (generálova dcéra). Robotníčkou sa stala dcéra Emy Bovaryovej." }
        ]
    },
    {
        question: "Čo tvrdil Julien Sorel vo svojej obhajobe na súde predtým, ako bol popravený?",
        options: [
            { text: "Odsúdil morálku spoločnosti s tým, že ho chcú popraviť len na výstrahu, aby sa chudobní nesnažili dostať do vyššej vrstvy.", isCorrect: true, feedback: "" },
            { text: "Úprimne sa ospravedlnil pani Derenalovej a vyjadril ľútosť nad stratou svojich ilúzií, čím dosiahol katarziu.", isCorrect: false, feedback: "Záver románu výslovne nemá žiadnu katarziu. Julien sa neospravedlňoval z ľútosti, ale útočil na spoločenský systém." },
            { text: "Obvinil Matildu z toho, že na neho nastražila pascu z pomsty a prinútila ho strieľať.", isCorrect: false, feedback: "Juliena neprinútila strieľať Matilda, ale urážlivý list, ktorý mu poslala pani Derenalová." },
            { text: "Žiadal o zrušenie trestu smrti a navrhol súboj so starostom, aby obhájil svoju česť.", isCorrect: false, feedback: "Julien si nevyžiadal súboj so starostom; prijal svoj rozsudok a súdny proces využil na spoločenskú obžalobu." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT (V8) =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        setTimeout(function() {
            advanceToNext();
        }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) {
        btn.classList.add('visible');
        btn.focus();
    }
}

function advanceToNext() {
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) {
            closeModal();
        }
    }
});

document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
});

initQuiz();
</script>
</body>
</html>
