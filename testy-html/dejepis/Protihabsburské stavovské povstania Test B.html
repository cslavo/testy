<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívny Test B</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center; color: #fff; margin-bottom: 8px;
            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }
        .progress-wrapper {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px; transition: width 0.4s ease; width: 0%;
        }
        .question-card {
            background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .question-card.active { display: block; }
        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.95em; line-height: 1.4; color: #333;
        }
        .option-item:hover { border-color: #667eea; background: #f0f0ff; }
        .option-item.correct {
            border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 600;
        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 28px; font-size: 1em; border-radius: 25px;
            cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
            float: right; pointer-events: auto;
        }
        .next-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .next-btn.visible { display: inline-block; }
        .results-card {
            background: #fff; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .results-card h2 { font-size: 1.6em; margin-bottom: 10px; color: #333; }
        .results-score { font-size: 2.8em; font-weight: 700; margin: 20px 0; }
        .results-score.excellent { color: #4caf50; }
        .results-score.good { color: #ff9800; }
        .results-score.poor { color: #f44336; }
        .results-message { font-size: 1.05em; margin-bottom: 30px; color: #555; }
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 14px 40px; font-size: 1.05em; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { color: #f44336; margin-bottom: 12px; font-size: 1.2em; }
        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Protihabsburské stavovské povstania</h1>
        <div class="subtitle">Test B</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="quizContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Výsledky testu</h2>
            <div class="results-score" id="resultsScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="restart-btn" id="restartBtn">Skúsiť znova</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>Nesprávna odpoveď</h3>
            <p id="modalText"></p>
            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>
        </div>
    </div>

<script>
const questionsData = [
    {
        question: "Ako povstalci vystupovali v medzinárodných konfliktoch počas povstaní?",
        options: [
            { text: "Ako spojenci Osmanskej ríše alebo protihabsburských koalícií (napr. Francúzsko).", isCorrect: true, feedback: "" },
            { text: "Ako spojenci Habsburgovcov proti Osmanskej ríši.", isCorrect: false, feedback: "Boli to PROTI-habsburské povstania, takže sa spájali s nepriateľmi Habsburgovcov (Turci, Francúzi), nie s nimi." },
            { text: "Ako neutrálna strana, ktorá sa do vojen nezapájala.", isCorrect: false, feedback: "Boli aktívnymi účastníkmi a využívali ťažkosti Habsburgovcov v iných vojnách (15-ročná, 30-ročná vojna)." },
            { text: "Ako spojenci Ruska a Poľska.", isCorrect: false, feedback: "Poľsko v rozhodujúcich chvíľach (Viedeň 1683) bojovalo na strane Habsburgovcov proti Turkom, teda proti spojencom povstalcov." }
        ]
    },
    {
        question: "Kto boli hajdúsi, ktorých do svojej armády povolával Štefan Bočkaj?",
        options: [
            { text: "Chudobní roľníci, ktorí videli v armáde možné výhody.", isCorrect: true, feedback: "" },
            { text: "Bohatí magnáti zo Sedmohradska.", isCorrect: false, feedback: "Sedmohradskí magnáti povstania viedli, ale hajdúsi boli radoví vojaci z radov chudobných roľníkov." },
            { text: "Tureckí žoldnieri vyslaní sultánom.", isCorrect: false, feedback: "Hajdúsi boli domáci obyvatelia, nie turecké jednotky, hoci Turci povstania podporovali." },
            { text: "Nemeckí vojaci bojujúci za žold.", isCorrect: false, feedback: "Nemeckí žoldnieri zvyčajne bojovali na strane cisára (Habsburgovcov)." }
        ]
    },
    {
        question: "Aký politický výsledok prinieslo prvé povstanie Štefana Bočkaja okrem náboženskej slobody?",
        options: [
            { text: "Panovník opäť menoval palatína a taverníka a obnovil výsady šľachty.", isCorrect: true, feedback: "" },
            { text: "Panovník sa vzdal uhorského trónu v prospech Bočkaja.", isCorrect: false, feedback: "Habsburgovci si trón udržali, urobili len ústupky v obsadzovaní úradov." },
            { text: "Uhorsko získalo úplnú nezávislosť od Viedne.", isCorrect: false, feedback: "Úplná nezávislosť dosiahnutá nebola, išlo len o obnovenie právomocí v rámci monarchie." },
            { text: "Bočkaj sa stal dedičným kráľom Slovenska.", isCorrect: false, feedback: "Titul 'kráľ Slovenska' neexistoval a Bočkajovi zostala len správa časti územia na východe." }
        ]
    },
    {
        question: "Akej významnej koristi sa zmocnil Gabriel Betlen po obsadení Bratislavy?",
        options: [
            { text: "Korunovačných klenotov (insígnií).", isCorrect: true, feedback: "" },
            { text: "Štátnej pokladnice plnej zlata.", isCorrect: false, feedback: "Text špecificky spomína zmocnenie sa korunovačných klenotov, ktoré mali obrovský symbolický význam." },
            { text: "Cisárskeho archívu s tajnými dokumentmi.", isCorrect: false, feedback: "O archíve text nehovorí, kľúčovým ziskom boli insígnie." },
            { text: "Cisárovej manželky a detí.", isCorrect: false, feedback: "Cisárska rodina nebola v tom čase v Bratislave zajatá." }
        ]
    },
    {
        question: "Aká udalosť v roku 1620 rozhodla o osude Betlenovho povstania?",
        options: [
            { text: "Bitka pri Bielej hore, kde Habsburgovci porazili českú šľachtu.", isCorrect: true, feedback: "" },
            { text: "Bitka pri Moháči, kde Turci porazili Uhorsko.", isCorrect: false, feedback: "Bitka pri Moháči (1526) bola o storočie skôr." },
            { text: "Bitka pri Trenčíne, kde bol porazený Betlen.", isCorrect: false, feedback: "Pri Trenčíne (1708) bol porazený František II. Rákoci, nie Betlen." },
            { text: "Podpísanie mieru v Linci.", isCorrect: false, feedback: "Mier v Linci (1645) ukončil až nasledujúce povstanie Juraja I. Rákociho." }
        ]
    },
    {
        question: "Kto bol hlavným spojencom Juraja I. Rákociho v boji proti Habsburgovcom?",
        options: [
            { text: "Francúzsko a Švédsko (v závere 30-ročnej vojny).", isCorrect: true, feedback: "" },
            { text: "Poľsko a Rusko.", isCorrect: false, feedback: "Tieto krajiny neboli jeho hlavnými spojencami v kontexte 30-ročnej vojny." },
            { text: "Španielsko a Taliansko.", isCorrect: false, feedback: "Španielsko bolo ovládané Habsburgovcami, takže bolo nepriateľom." },
            { text: "Anglicko a Holandsko.", isCorrect: false, feedback: "Text spomína spojenectvo s Francúzskom a Švédskom." }
        ]
    },
    {
        question: "Aké boli následky odhalenia Vešeléniho sprisahania pre uhorskú šľachtu?",
        options: [
            { text: "Popravy účastníkov, konfiškácie majetkov a rekatolizácia.", isCorrect: true, feedback: "" },
            { text: "Udelenie amnestie a vrátenie majetkov.", isCorrect: false, feedback: "Naopak, účastníci boli popravení a majetky zhabané." },
            { text: "Zvýšenie právomocí palatína.", isCorrect: false, feedback: "Funkcia palatína bola po sprisahaní oslabená a obsadzovaná cudzincami." },
            { text: "Vyhlásenie náboženskej slobody.", isCorrect: false, feedback: "Cisár využil situáciu na rekatolizáciu (násilný návrat ku katolicizmu) a branie kostolov." }
        ]
    },
    {
        question: "Čo sa dohodlo na Šopronskom sneme v roku 1681 počas povstania Imricha Tököliho?",
        options: [
            { text: "Protestantom boli priznané náboženské slobody a mohli stavať artikulárne kostoly.", isCorrect: true, feedback: "" },
            { text: "Protestantom bolo zakázané stavať akékoľvek kostoly.", isCorrect: false, feedback: "Naopak, mohli stavať tzv. artikulárne kostoly (z dreva, bez veže)." },
            { text: "Tököli bol korunovaný za uhorského kráľa.", isCorrect: false, feedback: "Tököli nebol korunovaný, snem riešil náboženské otázky a postavenie palatína." },
            { text: "Bola vyhlásená vojna Francúzsku.", isCorrect: false, feedback: "Francúzsko bolo v tom čase podporovateľom Tököliho." }
        ]
    },
    {
        question: "Kto definitívne vyhnal turecké vojská z územia Uhorska po bitke pri Zente (1697)?",
        options: [
            { text: "Cisársky veliteľ Eugen Savojský.", isCorrect: true, feedback: "" },
            { text: "Poľský kráľ Ján III. Sobieski.", isCorrect: false, feedback: "Sobieski pomohol pri Viedni (1683), ale definitívne vyhnanie po Zente viedol Eugen Savojský." },
            { text: "František II. Rákoci.", isCorrect: false, feedback: "Rákoci viedol protihabsburské povstanie neskôr, nebojoval proti Turkom pri Zente." },
            { text: "Generál Pálffy.", isCorrect: false, feedback: "Hoci bol významným generálom, hlavným veliteľom pri Zente bol Eugen Savojský." }
        ]
    },
    {
        question: "Aký bol hlavný cieľ povstania Františka II. Rákociho?",
        options: [
            { text: "Politický – obmedzenie moci Habsburgovcov a zlepšenie postavenia Uhorska.", isCorrect: true, feedback: "" },
            { text: "Náboženský – výlučne boj za práva evanjelikov.", isCorrect: false, feedback: "Rákoci bol katolík, nešlo mu primárne o náboženstvo (ako iným), ale o politickú moc." },
            { text: "Sociálny – zrušenie poddanstva a nastolenie republiky.", isCorrect: false, feedback: "Cieľom nebolo zrušenie poddanstva (hoci sľuboval úľavy) ani republika, ale monarchia bez Habsburgovcov." },
            { text: "Územný – pripojenie Uhorska k Poľsku.", isCorrect: false, feedback: "Cieľom bola samostatnosť v rámci ríše alebo detronizácia Habsburgovcov, nie pripojenie k Poľsku." }
        ]
    },
    {
        question: "Čo potvrdil Satmársky mier (1711), ktorým sa skončilo posledné povstanie?",
        options: [
            { text: "Habsburgovci si obhájili dedičný trón, ale potvrdili privilégiá šľachty.", isCorrect: true, feedback: "" },
            { text: "Habsburgovci stratili uhorský trón a museli odísť z krajiny.", isCorrect: false, feedback: "Habsburgovci ostali na tróne, to bol ich hlavný úspech." },
            { text: "Šľachta stratila všetky svoje výsady a majetky.", isCorrect: false, feedback: "Mier bol kompromisom – šľachte ostali privilégiá aj náboženská sloboda." },
            { text: "Uhorsko bolo rozdelené medzi Turecko a Rakúsko.", isCorrect: false, feedback: "Uhorsko ostalo celistvé pod vládou Habsburgovcov, Turci už boli vyhnaní." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT (V8) =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        // Correct answer: auto-advance after 1.5s
        setTimeout(function() {
            advanceToNext();
        }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        // Highlight the correct answer in green
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        // Wrong answer: NO auto-advance! Show modal, then manual "Next" button.
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            // No feedback text — show next button immediately
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) {
        btn.classList.add('visible');
        btn.focus();
    }
}

function advanceToNext() {
    // Guard: do not advance while waiting for user to review correct answer
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    // After closing modal, show the "Next question" button so user can review the correct answer
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) {
            closeModal();
        }
    }
});

document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
});

initQuiz();
</script>
</body>
</html>
