<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktívny Test B</title>
    <script>window.MathJax = {tex: {inlineMath: [['$', '$']]}};</script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            text-align: center; color: #fff; margin-bottom: 8px;
            font-size: 1.5em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); line-height: 1.3;
        }
        .subtitle {
            text-align: center; color: rgba(255,255,255,0.9);
            font-weight: 600; font-size: 1.1em; margin-bottom: 20px;
        }
        .progress-wrapper {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-weight: 600; color: #333; font-size: 0.95em;
        }
        .progress-bar-track {
            height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px; transition: width 0.4s ease; width: 0%;
        }
        .question-card {
            background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .question-card.active { display: block; }
        .question-card.answered { pointer-events: none; }
        .question-text {
            font-size: 1.1em; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #333;
        }
        .question-number {
            display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; width: 30px; height: 30px; border-radius: 50%;
            text-align: center; line-height: 30px; font-size: 0.85em;
            margin-right: 10px; font-weight: 700;
        }
        .options-list { list-style: none; }
        .option-item {
            padding: 13px 16px; margin-bottom: 8px; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 0.95em; line-height: 1.4; color: #333;
        }
        .option-item:hover { border-color: #667eea; background: #f0f0ff; }
        .option-item.correct {
            border-color: #4caf50; background: #e8f5e9; color: #2e7d32; font-weight: 600;
        }
        .option-item.incorrect {
            border-color: #f44336; background: #ffebee; color: #c62828;
        }
        .next-btn {
            display: none; margin-top: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 28px; font-size: 1em; border-radius: 25px;
            cursor: pointer; font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
            float: right; pointer-events: auto;
        }
        .next-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .next-btn.visible { display: inline-block; }
        .results-card {
            background: #fff; border-radius: 12px; padding: 40px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none;
        }
        .results-card h2 { font-size: 1.6em; margin-bottom: 10px; color: #333; }
        .results-score { font-size: 2.8em; font-weight: 700; margin: 20px 0; }
        .results-score.excellent { color: #4caf50; }
        .results-score.good { color: #ff9800; }
        .results-score.poor { color: #f44336; }
        .results-message { font-size: 1.05em; margin-bottom: 30px; color: #555; }
        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 14px 40px; font-size: 1.05em; border-radius: 30px; cursor: pointer;
            font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
        }
        .restart-btn:hover {
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 12px; padding: 28px; max-width: 500px;
            width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { color: #f44336; margin-bottom: 12px; font-size: 1.2em; }
        .modal-content p { color: #555; font-size: 0.95em; line-height: 1.6; margin-bottom: 18px; }
        .modal-close-btn {
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none;
            padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.95em; font-weight: 600;
        }
        .modal-close-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Priemyselná revolúcia</h1>
        <div class="subtitle">Test B</div>
        <div class="progress-wrapper">
            <div class="progress-header">
                <span id="questionCounter">Otázka 1 / 0</span>
                <span id="progressPercent">0 %</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="quizContainer"></div>
        <div class="results-card" id="resultsCard">
            <h2>Výsledky testu</h2>
            <div class="results-score" id="resultsScore"></div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="restart-btn" id="restartBtn">Skúsiť znova</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>Nesprávna odpoveď</h3>
            <p id="modalText"></p>
            <button class="modal-close-btn" id="modalCloseBtn">Rozumiem</button>
        </div>
    </div>

<script>
const questionsData = [
    {
        question: "Kam sa z Anglicka v priebehu 19. storočia rozšírila priemyselná revolúcia?",
        options: [
            { text: "Do západnej Európy, USA a Japonska", isCorrect: true, feedback: "" },
            { text: "Do východnej Európy, Ruska a Číny", isCorrect: false, feedback: "V 19. storočí sa revolúcia primárne šírila na západ a do Japonska, východná Európa a Čína nastúpili neskôr." },
            { text: "Iba do britských kolónií v Afrike", isCorrect: false, feedback: "Priemysel sa rozširoval najmä do nezávislých rozvinutých štátov (USA, západná Európa), nie primárne do afrických kolónií." },
            { text: "Do Južnej Ameriky a Austrálie", isCorrect: false, feedback: "Text špecificky spomína západnú Európu, USA a Japonsko ako hlavné smery šírenia v 19. storočí." }
        ]
    },
    {
        question: "Čo sa stalo v roku 1707, čo prispelo k vzniku politických predpokladov revolúcie?",
        options: [
            { text: "Vytvorila sa únia medzi Anglickom, Škótskom a Írskom, čím vznikla zóna voľného obchodu", isCorrect: true, feedback: "" },
            { text: "Anglicko vyhlásilo nezávislosť od Francúzska", isCorrect: false, feedback: "V roku 1707 išlo o vznik únie (Spojené kráľovstvo), nie o nezávislosť od Francúzska." },
            { text: "Parlament zrušil monarchiu a vyhlásil republiku", isCorrect: false, feedback: "Monarchia ostala zachovaná (konštitučná), rok 1707 sa spája so zjednotením trhu a úniou." },
            { text: "Bola podpísaná mierová zmluva s USA", isCorrect: false, feedback: "USA v roku 1707 ešte neexistovali, išlo o vnútornú úniu britských ostrovov." }
        ]
    },
    {
        question: "Akú úlohu zohrávali britské kolónie v priemyselnej revolúcii?",
        options: [
            { text: "Slúžili ako zdroj lacných surovín a ako odbytisko pre tovar", isCorrect: true, feedback: "" },
            { text: "Poskytovali výhradne pracovnú silu do anglických tovární", isCorrect: false, feedback: "Pracovná sila v továrňach bola domáca (z vidieka), kolónie slúžili na suroviny a predaj tovaru." },
            { text: "Boli centrami vývoja nových technológií", isCorrect: false, feedback: "Technológie sa vyvíjali v Anglicku, kolónie boli hospodárskym zázemím." },
            { text: "Slúžili len na vojenské účely", isCorrect: false, feedback: "Mali kľúčový hospodársky význam (suroviny, trh), nielen vojenský." }
        ]
    },
    {
        question: "Aká energia sa využívala pred vynájdením parného stroja?",
        options: [
            { text: "Sila ľudí, zvierat, vetra a vody", isCorrect: true, feedback: "" },
            { text: "Sila spaľovacích motorov", isCorrect: false, feedback: "Spaľovacie motory prišli až po parnom stroji, predtým sa využívala prírodná a svalová sila." },
            { text: "Elektrická energia z primitívnych batérií", isCorrect: false, feedback: "Elektrina sa začala priemyselne využívať až koncom 19. storočia, parný stroj ju predbehol." },
            { text: "Jadrová energia", isCorrect: false, feedback: "Toto je technológia 20. storočia, v 18. storočí sa spoliehali na vietor, vodu a svaly." }
        ]
    },
    {
        question: "Ktorá časť Anglicka bola označovaná ako „čierne Anglicko“ a prečo?",
        options: [
            { text: "Severná časť, pretože bola priemyselná", isCorrect: true, feedback: "" },
            { text: "Južná časť, kvôli úrodnej čierozemi", isCorrect: false, feedback: "Pojem 'čierne Anglicko' sa viaže na priemysel a znečistenie na severe, nie na pôdu na juhu." },
            { text: "Londýn a okolie kvôli hustému osídleniu", isCorrect: false, feedback: "Priemyselným centrom s prívlastkom 'čierne' bol sever Anglicka." },
            { text: "Západné pobrežie kvôli dovozu čierneho korenia", isCorrect: false, feedback: "Názov súvisí s dymom a uhlím v priemyselnej severnej časti, nie s korením." }
        ]
    },
    {
        question: "Prečo nastal počas revolúcie rozvoj baníctva?",
        options: [
            { text: "Zvýšila sa potreba železa a uhlia na výrobu a pohon strojov", isCorrect: true, feedback: "" },
            { text: "Kvôli objaveniu ložísk zlata v Anglicku", isCorrect: false, feedback: "Baníctvo sa rozvíjalo kvôli železnej rude a uhliu pre priemysel, nie kvôli zlatu." },
            { text: "Aby sa získal stavebný materiál na mrakodrapy", isCorrect: false, feedback: "Ťažilo sa najmä uhlie a ruda pre stroje a železnice, mrakodrapy prišli neskôr." },
            { text: "Kvôli exportu drahých kameňov do kolónií", isCorrect: false, feedback: "Dovážali sa suroviny z kolónií, doma sa ťažilo uhlie a železo pre vlastnú potrebu." }
        ]
    },
    {
        question: "Ako sa nazývala nová spoločenská skupina robotníkov, ktorá vznikla počas revolúcie?",
        options: [
            { text: "Proletariát", isCorrect: true, feedback: "" },
            { text: "Buržoázia", isCorrect: false, feedback: "Buržoázia sú majitelia a mešťania, robotníci sa nazývali proletariát." },
            { text: "Aristokracia", isCorrect: false, feedback: "Aristokracia je šľachta, robotnícka trieda je proletariát." },
            { text: "Cechoví majstri", isCorrect: false, feedback: "Cechy zanikali, vznikal priemyselný proletariát." }
        ]
    },
    {
        question: "Čo požadovala encyklika Rerum novarum?",
        options: [
            { text: "Spravodlivú mzdu a spoluprácu medzi podnikateľmi a robotníkmi", isCorrect: true, feedback: "" },
            { text: "Okamžité zrušenie súkromného vlastníctva", isCorrect: false, feedback: "Encyklika nežiadala komunizmus (zrušenie vlastníctva), ale spravodlivú mzdu a spoluprácu." },
            { text: "Zákaz práce žien v továrňach", isCorrect: false, feedback: "Hlavnou požiadavkou bola spravodlivá mzda a zlepšenie postavenia, nie úplný zákaz práce žien." },
            { text: "Návrat k feudálnemu systému", isCorrect: false, feedback: "Cieľom bolo riešiť nové problémy robotníkov (spravodlivá mzda), nie návrat do stredoveku." }
        ]
    },
    {
        question: "Čo vynašiel George Stephenson?",
        options: [
            { text: "Prvú parnú lokomotívu", isCorrect: true, feedback: "" },
            { text: "Prvú paroloď", isCorrect: false, feedback: "Paroloď vynašiel Fulton. Stephenson je otcom parnej lokomotívy." },
            { text: "Telegraf", isCorrect: false, feedback: "Telegraf sa spája s Edisonom a inými, Stephenson vynašiel lokomotívu." },
            { text: "Lietadlo", isCorrect: false, feedback: "Lietadlo zostrojili bratia Wrightovci." }
        ]
    },
    {
        question: "Ktorý vynálezca je spojený s vynálezom telefónu?",
        options: [
            { text: "Graham Bell", isCorrect: true, feedback: "" },
            { text: "Thomas Alva Edison", isCorrect: false, feedback: "Edison vylepšil mikrofón, ale vynález telefónu sa v texte pripisuje Bellovi." },
            { text: "Werner von Siemens", isCorrect: false, feedback: "Siemens vynašiel dynamo, telefón vynašiel Bell." },
            { text: "Bratia Montgolfiérovci", isCorrect: false, feedback: "Títo bratia vynašli balón, telefón vynašiel Graham Bell." }
        ]
    },
    {
        question: "Ktorý zoznam vynálezov patrí Thomasovi Alva Edisonovi?",
        options: [
            { text: "Žiarovka, mikrofón, gramofón, telegraf, kamera", isCorrect: true, feedback: "" },
            { text: "Dynamit, parná lokomotíva, telefón", isCorrect: false, feedback: "Toto je mix vynálezov Nobela, Stephensona a Bella. Edison má na konte žiarovku či gramofón." },
            { text: "Lietadlo, paroloď, dynamo", isCorrect: false, feedback: "Lietadlo (Wrightovci), paroloď (Fulton), dynamo (Siemens) nepatria Edisonovi." },
            { text: "Teplovzdušný balón, rádio, automobil", isCorrect: false, feedback: "Balón mali Montgolfiérovci. Edisonov zoznam zahŕňa žiarovku a fonograf (gramofón)." }
        ]
    },
    {
        question: "Čo vynašli Bratia Montgolfiérovci?",
        options: [
            { text: "Teplovzdušný balón", isCorrect: true, feedback: "" },
            { text: "Lietadlo", isCorrect: false, feedback: "Lietadlo vynašli bratia Wrightovci, Montgolfiérovci vynašli balón." },
            { text: "Parnú turbínu", isCorrect: false, feedback: "Parnú turbínu text nespomína, Montgolfiérovci sú uvedení pri balóne." },
            { text: "Filmovú kameru", isCorrect: false, feedback: "Kameru text pripisuje Edisonovi. Montgolfiérovci zostrojili balón." }
        ]
    }
];

// ===== UNIVERSAL SCRIPT (V8) =====
let currentQuestion = 0;
let score = 0;
let answered = 0;
let shuffledQuestions = [];
let waitingForNext = false;
let pendingNextQIndex = -1;

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function initQuiz() {
    currentQuestion = 0;
    score = 0;
    answered = 0;
    waitingForNext = false;
    pendingNextQIndex = -1;
    shuffledQuestions = shuffle(questionsData).map(function(q) {
        return { question: q.question, options: shuffle(q.options) };
    });
    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('quizContainer').style.display = 'block';
    renderQuiz();
    updateProgress();
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function renderQuiz() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    shuffledQuestions.forEach(function(q, qIndex) {
        var card = document.createElement('div');
        card.className = 'question-card' + (qIndex === 0 ? ' active' : '');
        card.id = 'qcard-' + qIndex;

        var optionsHTML = '';
        q.options.forEach(function(opt) {
            optionsHTML += '<li class="option-item" data-correct="' + opt.isCorrect + '" data-feedback="' + escapeAttr(opt.feedback) + '">' + opt.text + '</li>';
        });

        card.innerHTML = '<div class="question-text"><span class="question-number">' + (qIndex + 1) + '</span>' + q.question + '</div><ul class="options-list">' + optionsHTML + '</ul><button class="next-btn" id="nextBtn-' + qIndex + '">Ďalšia otázka →</button>';
        container.appendChild(card);

        var items = card.querySelectorAll('.option-item');
        items.forEach(function(item) {
            item.addEventListener('click', function() {
                handleAnswer(card, item, qIndex);
            });
        });

        document.getElementById('nextBtn-' + qIndex).addEventListener('click', function() {
            waitingForNext = false;
            advanceToNext();
        });
    });
}

function escapeAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function handleAnswer(card, selectedItem, qIndex) {
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    answered++;

    var isCorrect = selectedItem.getAttribute('data-correct') === 'true';
    var feedback = selectedItem.getAttribute('data-feedback');

    if (isCorrect) {
        selectedItem.classList.add('correct');
        score++;
        updateProgress();
        // Correct answer: auto-advance after 1.5s
        setTimeout(function() {
            advanceToNext();
        }, 1500);
    } else {
        selectedItem.classList.add('incorrect');
        // Highlight the correct answer in green
        card.querySelectorAll('.option-item').forEach(function(opt) {
            if (opt.getAttribute('data-correct') === 'true') {
                opt.classList.add('correct');
            }
        });
        updateProgress();
        // Wrong answer: NO auto-advance! Show modal, then manual "Next" button.
        waitingForNext = true;
        if (feedback && feedback.length > 0) {
            showModal(decodeHTMLEntities(feedback), qIndex);
        } else {
            // No feedback text — show next button immediately
            showNextButton(qIndex);
        }
    }
}

function showNextButton(qIndex) {
    var btn = document.getElementById('nextBtn-' + qIndex);
    if (btn) {
        btn.classList.add('visible');
        btn.focus();
    }
}

function advanceToNext() {
    // Guard: do not advance while waiting for user to review correct answer
    if (waitingForNext) return;
    if (answered >= shuffledQuestions.length) {
        showResults();
    } else {
        currentQuestion++;
        showQuestion(currentQuestion);
    }
}

function decodeHTMLEntities(text) {
    var ta = document.createElement('textarea');
    ta.innerHTML = text;
    return ta.value;
}

function showQuestion(index) {
    document.querySelectorAll('.question-card').forEach(function(c) { c.classList.remove('active'); });
    var next = document.getElementById('qcard-' + index);
    if (next) {
        next.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.MathJax) { window.MathJax.typesetPromise(); }
    }
}

function updateProgress() {
    var total = shuffledQuestions.length;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPercent').textContent = pct + ' %';
    document.getElementById('questionCounter').textContent = 'Otázka ' + Math.min(answered + 1, total) + ' / ' + total;
}

function showResults() {
    document.getElementById('quizContainer').style.display = 'none';
    var resultsCard = document.getElementById('resultsCard');
    resultsCard.style.display = 'block';

    var total = shuffledQuestions.length;
    var pct = Math.round((score / total) * 100);
    var scoreEl = document.getElementById('resultsScore');
    scoreEl.textContent = score + ' / ' + total + ' (' + pct + ' %)';

    scoreEl.className = 'results-score';
    if (pct >= 80) {
        scoreEl.classList.add('excellent');
        document.getElementById('resultsMessage').textContent = 'Výborný výsledok! Učivo máš dobre zvládnuté.';
    } else if (pct >= 50) {
        scoreEl.classList.add('good');
        document.getElementById('resultsMessage').textContent = 'Dobrý výsledok, ale ešte je priestor na zlepšenie.';
    } else {
        scoreEl.classList.add('poor');
        document.getElementById('resultsMessage').textContent = 'Skús si učivo zopakovať a test absolvovať znova.';
    }

    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100 %';
    document.getElementById('questionCounter').textContent = 'Dokončené: ' + score + ' / ' + total + ' správne';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showModal(text, qIndex) {
    pendingNextQIndex = qIndex;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalOverlay').classList.add('active');
    if (window.MathJax) { window.MathJax.typesetPromise(); }
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    // After closing modal, show the "Next question" button so user can review the correct answer
    if (waitingForNext && pendingNextQIndex >= 0) {
        showNextButton(pendingNextQIndex);
        pendingNextQIndex = -1;
    }
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Enter') {
        if (document.getElementById('modalOverlay').classList.contains('active')) {
            closeModal();
        }
    }
});

document.getElementById('restartBtn').addEventListener('click', function() {
    initQuiz();
});

initQuiz();
</script>
</body>
</html>
